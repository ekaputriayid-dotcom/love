<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Crystal Rose</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Outfit", sans-serif;
      color: #ffe4ef;
      touch-action: none;
    }
    #c {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #c:active { cursor: grabbing; }
    .hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 5;
      padding: 1.15rem 1rem 0;
      text-align: center;
      pointer-events: none;
    }
    .hud h1 {
      font-size: clamp(1.15rem, 4.2vw, 1.55rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-shadow: 0 0 22px rgba(255, 140, 190, 0.55);
    }
    .hud p {
      margin-top: 0.35rem;
      font-size: 0.86rem;
      color: rgba(255, 200, 220, 0.55);
    }
    .hint {
      position: fixed;
      bottom: 1.15rem;
      left: 0; right: 0;
      z-index: 5;
      text-align: center;
      font-size: 0.78rem;
      color: rgba(255, 190, 215, 0.4);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <h1>Crystal Rose</h1>
    <p>Drag to spin · Scroll / pinch to zoom</p>
  </div>
  <p class="hint">Every corner shines for you</p>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const canvas = document.getElementById("c");

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.02);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 7.5);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: "high-performance",
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.enablePan = true;
    controls.minDistance = 3.5;
    controls.maxDistance = 16;
    controls.target.set(0, 0.35, 0);
    controls.minPolarAngle = 0;
    controls.maxPolarAngle = Math.PI;
    controls.rotateSpeed = 0.9;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.05,
      0.42,
      0.18
    );
    composer.addPass(bloom);

    // Soft pink fill lights for crystal look
    scene.add(new THREE.AmbientLight(0xffb0d0, 0.35));
    const key = new THREE.PointLight(0xff6b9d, 2.4, 30);
    key.position.set(3, 4, 4);
    scene.add(key);
    const rim = new THREE.PointLight(0xffd0ef, 1.6, 25);
    rim.position.set(-3, 2, -2);
    scene.add(rim);
    const bottom = new THREE.PointLight(0xc44dff, 0.8, 20);
    bottom.position.set(0, -2, 2);
    scene.add(bottom);

    // Distant sparkle stars
    {
      const n = 900;
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const r = 12 + Math.random() * 40;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
        pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
        pos[i * 3 + 2] = r * Math.cos(ph);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0xffd6ea,
        size: 0.05,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      })));
    }

    const roseRoot = new THREE.Group();
    scene.add(roseRoot);

    // Glass / crystal material
    function glassMat(color, opacity = 0.55) {
      return new THREE.MeshPhysicalMaterial({
        color,
        metalness: 0.05,
        roughness: 0.12,
        transmission: 0.55,
        thickness: 0.6,
        transparent: true,
        opacity,
        ior: 1.45,
        emissive: color,
        emissiveIntensity: 0.22,
        side: THREE.DoubleSide,
        clearcoat: 1,
        clearcoatRoughness: 0.08,
      });
    }

    // —— Shiny sparkle at a world-ish local point ——
    function makeSparkle(size = 0.12) {
      const g = new THREE.Group();
      const mat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const a = new THREE.Mesh(new THREE.PlaneGeometry(size * 0.18, size * 1.6), mat);
      const b = new THREE.Mesh(new THREE.PlaneGeometry(size * 1.6, size * 0.18), mat.clone());
      const core = new THREE.Mesh(
        new THREE.SphereGeometry(size * 0.18, 8, 8),
        new THREE.MeshBasicMaterial({
          color: 0xffe0f0,
          transparent: true,
          opacity: 1,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      );
      g.add(a, b, core);
      g.userData.spin = 0.8 + Math.random() * 1.4;
      g.userData.phase = Math.random() * Math.PI * 2;
      return g;
    }

    const sparkles = [];

    function addSparkle(parent, x, y, z, size) {
      const s = makeSparkle(size);
      s.position.set(x, y, z);
      parent.add(s);
      sparkles.push(s);
      return s;
    }

    // —— Petal shape ——
    function petalShape(w = 1, h = 1.4) {
      const s = new THREE.Shape();
      s.moveTo(0, 0);
      s.bezierCurveTo(w * 0.7, h * 0.15, w * 0.85, h * 0.55, 0, h);
      s.bezierCurveTo(-w * 0.85, h * 0.55, -w * 0.7, h * 0.15, 0, 0);
      return s;
    }

    function makePetal(scale = 1, color = 0xff7aa8) {
      const geo = new THREE.ExtrudeGeometry(petalShape(0.9 * scale, 1.35 * scale), {
        depth: 0.06 * scale,
        bevelEnabled: true,
        bevelThickness: 0.04 * scale,
        bevelSize: 0.03 * scale,
        bevelSegments: 3,
        curveSegments: 18,
      });
      geo.center();
      const mesh = new THREE.Mesh(geo, glassMat(color, 0.62));
      return mesh;
    }

    // Bloom layers of petals
    const bloomGroup = new THREE.Group();
    bloomGroup.position.y = 1.55;
    roseRoot.add(bloomGroup);

    const petalColors = [0xff8fb8, 0xff6b9d, 0xffa0c8, 0xff4d88, 0xffc0d8];

    // Outer ring of petals
    for (let i = 0; i < 8; i++) {
      const petal = makePetal(1.05, petalColors[i % petalColors.length]);
      const a = (i / 8) * Math.PI * 2;
      petal.position.set(Math.cos(a) * 0.55, Math.sin(a * 2) * 0.08, Math.sin(a) * 0.55);
      petal.lookAt(0, 0.4, 0);
      petal.rotateX(-0.85);
      bloomGroup.add(petal);
      // shiny corners on petal tips
      addSparkle(petal, 0, 0.55, 0.05, 0.14);
      addSparkle(petal, 0.35, -0.1, 0.04, 0.08);
      addSparkle(petal, -0.35, -0.1, 0.04, 0.08);
    }

    // Mid layer
    for (let i = 0; i < 6; i++) {
      const petal = makePetal(0.78, petalColors[(i + 2) % petalColors.length]);
      const a = (i / 6) * Math.PI * 2 + 0.35;
      petal.position.set(Math.cos(a) * 0.28, 0.12, Math.sin(a) * 0.28);
      petal.lookAt(0, 0.5, 0);
      petal.rotateX(-1.05);
      bloomGroup.add(petal);
      addSparkle(petal, 0, 0.42, 0.04, 0.11);
    }

    // Inner bud
    for (let i = 0; i < 5; i++) {
      const petal = makePetal(0.48, 0xffd0e4);
      const a = (i / 5) * Math.PI * 2 + 0.2;
      petal.position.set(Math.cos(a) * 0.1, 0.28, Math.sin(a) * 0.1);
      petal.lookAt(0, 0.7, 0);
      petal.rotateX(-1.25);
      bloomGroup.add(petal);
    }

    // Crystal core
    const core = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.28, 1),
      new THREE.MeshPhysicalMaterial({
        color: 0xffe8f2,
        metalness: 0.2,
        roughness: 0.05,
        transmission: 0.7,
        transparent: true,
        opacity: 0.85,
        emissive: 0xff9ec0,
        emissiveIntensity: 0.55,
        clearcoat: 1,
      })
    );
    core.position.y = 0.35;
    bloomGroup.add(core);
    addSparkle(bloomGroup, 0, 0.75, 0.2, 0.2);
    addSparkle(bloomGroup, 0.45, 0.4, 0.35, 0.12);
    addSparkle(bloomGroup, -0.4, 0.5, 0.3, 0.12);

    // Stem
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.07, 2.6, 16),
      glassMat(0xff6b9d, 0.7)
    );
    stem.position.y = 0.05;
    roseRoot.add(stem);
    addSparkle(stem, 0.04, 0.9, 0.04, 0.09);
    addSparkle(stem, -0.04, 0.2, 0.04, 0.08);
    addSparkle(stem, 0.03, -0.7, 0.03, 0.08);

    // —— Orbiting crystal ring (thorn / light ring) ——
    const ringPivot = new THREE.Group();
    ringPivot.position.y = 0.15;
    ringPivot.rotation.x = 0.55;
    ringPivot.rotation.z = 0.25;
    roseRoot.add(ringPivot);

    const ringRadius = 1.55;
    const ringTube = new THREE.Mesh(
      new THREE.TorusGeometry(ringRadius, 0.028, 12, 96),
      new THREE.MeshPhysicalMaterial({
        color: 0xff8fb8,
        metalness: 0.35,
        roughness: 0.15,
        emissive: 0xff4d88,
        emissiveIntensity: 0.65,
        transparent: true,
        opacity: 0.9,
        clearcoat: 1,
      })
    );
    ringPivot.add(ringTube);

    // Spiky thorn accents along the ring
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2;
      const spike = new THREE.Mesh(
        new THREE.ConeGeometry(0.045, 0.22, 5),
        glassMat(0xffa0c8, 0.85)
      );
      spike.position.set(Math.cos(a) * ringRadius, Math.sin(a) * ringRadius, 0);
      spike.lookAt(0, 0, 0);
      spike.rotateX(Math.PI / 2);
      ringTube.add(spike);
      if (i % 2 === 0) {
        addSparkle(spike, 0, 0.12, 0, 0.1);
      }
    }

    // Floating butterflies & stars on the ring
    function makeButterflyTexture() {
      const c = document.createElement("canvas");
      c.width = 128; c.height = 128;
      const g = c.getContext("2d");
      g.clearRect(0, 0, 128, 128);
      g.fillStyle = "#ffb0d0";
      g.beginPath();
      g.ellipse(40, 64, 28, 36, -0.4, 0, Math.PI * 2);
      g.ellipse(88, 64, 28, 36, 0.4, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = "#ffe0ef";
      g.fillRect(60, 40, 8, 48);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeStarTexture() {
      const c = document.createElement("canvas");
      c.width = 128; c.height = 128;
      const g = c.getContext("2d");
      g.clearRect(0, 0, 128, 128);
      g.translate(64, 64);
      g.fillStyle = "#fff";
      g.shadowColor = "#ff8fb8";
      g.shadowBlur = 16;
      for (let i = 0; i < 4; i++) {
        g.rotate(Math.PI / 2);
        g.beginPath();
        g.moveTo(0, 0);
        g.lineTo(6, -50);
        g.lineTo(-6, -50);
        g.closePath();
        g.fill();
      }
      g.beginPath();
      g.arc(0, 0, 8, 0, Math.PI * 2);
      g.fill();
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const floaters = [];
    const butterflyTex = makeButterflyTexture();
    const starTex = makeStarTexture();

    [
      { tex: butterflyTex, angle: 0.4, scale: 0.55 },
      { tex: butterflyTex, angle: 2.6, scale: 0.45 },
      { tex: starTex, angle: 1.3, scale: 0.4 },
      { tex: starTex, angle: 4.0, scale: 0.35 },
      { tex: starTex, angle: 5.2, scale: 0.3 },
    ].forEach((f) => {
      const spr = new THREE.Sprite(
        new THREE.SpriteMaterial({
          map: f.tex,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        })
      );
      spr.userData.angle = f.angle;
      spr.userData.radius = ringRadius;
      spr.userData.bob = Math.random() * Math.PI * 2;
      spr.scale.set(f.scale, f.scale, 1);
      ringPivot.add(spr);
      floaters.push(spr);
      addSparkle(spr, 0, 0, 0, 0.08);
    });

    // Soft aura behind rose
    const aura = new THREE.Mesh(
      new THREE.SphereGeometry(2.2, 32, 32),
      new THREE.MeshBasicMaterial({
        color: 0xff4d88,
        transparent: true,
        opacity: 0.08,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      })
    );
    aura.position.y = 1.2;
    roseRoot.add(aura);

    // Auto-spin + user can override with drag
    let autoSpin = true;
    let userInteracting = false;

    controls.addEventListener("start", () => {
      userInteracting = true;
      autoSpin = false;
    });
    controls.addEventListener("end", () => {
      userInteracting = false;
      // resume gentle spin after a pause
      setTimeout(() => {
        if (!userInteracting) autoSpin = true;
      }, 1800);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const delta = clock.getDelta();

      controls.update();

      if (autoSpin) {
        roseRoot.rotation.y += delta * 0.35;
      }

      // Ring keeps orbiting
      ringPivot.rotation.z = 0.25 + Math.sin(t * 0.4) * 0.08;
      ringTube.rotation.z = t * 0.55;

      // Petals breathe slightly
      bloomGroup.rotation.y = Math.sin(t * 0.5) * 0.08;
      bloomGroup.scale.setScalar(1 + Math.sin(t * 1.6) * 0.02);
      core.rotation.y = t * 0.8;
      core.rotation.x = t * 0.35;

      // Floaters on ring
      for (const f of floaters) {
        const a = f.userData.angle + t * 0.55;
        f.position.set(
          Math.cos(a) * f.userData.radius,
          Math.sin(a) * f.userData.radius,
          Math.sin(t * 2 + f.userData.bob) * 0.15
        );
      }

      // Sparkles twinkle + face camera
      for (const s of sparkles) {
        s.quaternion.copy(camera.quaternion);
        const tw = 0.55 + 0.45 * Math.sin(t * s.userData.spin * 3 + s.userData.phase);
        s.scale.setScalar(tw);
      }

      // Moving light for glossy highlight sweep
      key.position.x = Math.cos(t * 0.7) * 3.5;
      key.position.z = Math.sin(t * 0.7) * 3.5;
      rim.intensity = 1.3 + Math.sin(t * 2) * 0.35;

      aura.material.opacity = 0.06 + Math.sin(t * 1.5) * 0.025;

      composer.render();
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloom.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
