<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universe of Love</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #fff4f8;
      --soft: rgba(255, 230, 240, 0.72);
      --pink: #ff6b9d;
      --card: #fff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background: #140a12;
    }

    body {
      background:
        radial-gradient(ellipse 90% 70% at 50% 110%, rgba(180, 40, 90, 0.35), transparent 55%),
        radial-gradient(ellipse 50% 40% at 15% 20%, rgba(120, 60, 140, 0.25), transparent 50%),
        radial-gradient(ellipse 45% 35% at 85% 30%, rgba(255, 90, 130, 0.18), transparent 45%),
        linear-gradient(180deg, #1a0f1c 0%, #120810 55%, #0d0810 100%);
    }

    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0;
      transition: opacity 1.2s ease;
      z-index: 5;
      pointer-events: none;
    }

    #canvas.on {
      opacity: 1;
      pointer-events: auto;
    }

    .ui {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 2rem;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .ui.hidden {
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
    }

    .header {
      text-align: center;
      margin-bottom: 1.25rem;
      max-width: 420px;
    }

    .eyebrow {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 200, 220, 0.55);
      margin-bottom: 0.65rem;
    }

    .title {
      font-size: clamp(1.7rem, 6vw, 2.35rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.45rem;
    }

    .hint {
      font-size: 0.98rem;
      color: var(--soft);
      line-height: 1.45;
    }

    .progress {
      margin-top: 0.85rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(255, 180, 205, 0.7);
      letter-spacing: 0.04em;
    }

    .gallery {
      position: relative;
      width: min(100%, 420px);
      height: min(62vh, 480px);
      margin: 0.5rem auto 0;
    }

    .photo {
      position: absolute;
      width: clamp(108px, 28vw, 132px);
      padding: 8px 8px 28px;
      background: var(--card);
      border: none;
      border-radius: 4px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      transform: translate(-50%, -50%) rotate(var(--rot)) scale(1);
      transition: transform 0.35s ease, box-shadow 0.35s ease, filter 0.35s ease;
      animation: floatSoft 5.5s ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .photo img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 2px;
      pointer-events: none;
    }

    .photo::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 10px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff6b9d;
      transform: translateX(-50%);
      opacity: 0.85;
      box-shadow: 0 0 10px rgba(255, 107, 157, 0.7);
    }

    .photo.opened {
      filter: saturate(0.85) brightness(0.92);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28), 0 0 0 2px rgba(255, 107, 157, 0.55);
    }

    .photo.opened::after {
      background: #4ade80;
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.7);
    }

    .photo:hover, .photo:focus-visible {
      outline: none;
      z-index: 4;
      transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.08);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.42), 0 0 24px rgba(255, 107, 157, 0.35);
    }

    .photo:nth-child(1) { left: 22%; top: 22%; --rot: -8deg; --delay: 0s; }
    .photo:nth-child(2) { left: 72%; top: 18%; --rot: 7deg; --delay: 0.4s; }
    .photo:nth-child(3) { left: 50%; top: 42%; --rot: -2deg; --delay: 0.8s; }
    .photo:nth-child(4) { left: 20%; top: 68%; --rot: 6deg; --delay: 1.1s; }
    .photo:nth-child(5) { left: 78%; top: 66%; --rot: -7deg; --delay: 1.5s; }
    .photo:nth-child(6) { left: 48%; top: 82%; --rot: 4deg; --delay: 0.2s; }

    @keyframes floatSoft {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -8px; }
    }

    /* Message modal */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: rgba(10, 4, 10, 0.55);
      backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .modal.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      width: min(100%, 360px);
      background: linear-gradient(165deg, #fff7fa, #ffe4ee);
      color: #5c2a3d;
      border-radius: 22px;
      padding: 1.6rem 1.4rem 1.35rem;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      transform: translateY(16px) scale(0.96);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal.open .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-card img {
      width: 88px;
      height: 88px;
      object-fit: cover;
      border-radius: 14px;
      margin: 0 auto 1rem;
      display: block;
      box-shadow: 0 8px 20px rgba(232, 90, 140, 0.25);
    }

    .modal-card h2 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(92, 42, 61, 0.5);
      margin-bottom: 0.55rem;
    }

    .modal-card p {
      font-size: clamp(1.25rem, 4.5vw, 1.5rem);
      font-weight: 600;
      line-height: 1.4;
      letter-spacing: -0.01em;
      margin-bottom: 1.35rem;
    }

    .modal-card button {
      appearance: none;
      border: none;
      background: #e85a8c;
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.8rem 1.6rem;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 10px 24px -12px rgba(232, 90, 140, 0.7);
    }

    .modal-card button:active { transform: scale(0.98); }

    /* Final question */
    .finale {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      background:
        radial-gradient(ellipse 70% 50% at 50% 40%, rgba(255, 120, 160, 0.12), transparent 60%);
    }

    .finale.show {
      opacity: 1;
      visibility: visible;
    }

    .finale.gone {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .finale-inner {
      text-align: center;
      max-width: 420px;
    }

    .finale .eyebrow { color: rgba(255, 200, 220, 0.6); }

    .finale h1 {
      font-size: clamp(1.9rem, 7vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0.4rem 0 0.55rem;
    }

    .finale .sub {
      color: var(--soft);
      margin-bottom: 1.8rem;
      font-size: 1.1rem;
    }

    .choices {
      display: flex;
      gap: 0.85rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: none;
      background: #e85a8c;
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.9rem 2rem;
      min-width: 128px;
      cursor: pointer;
      border-radius: 14px;
      box-shadow: 0 10px 28px -12px rgba(232, 90, 140, 0.65);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn:hover { transform: translateY(-2px); background: #d9487c; }
    .btn.no {
      background: rgba(255, 255, 255, 0.1);
      border: 1.5px solid rgba(255, 220, 230, 0.35);
      color: #fff;
      box-shadow: none;
    }
    .btn.no:hover { background: rgba(255, 255, 255, 0.16); }
    .btn:active { transform: scale(0.98); }

    @media (max-width: 380px) {
      .gallery { height: 58vh; }
      .photo { width: 100px; padding-bottom: 24px; }
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <canvas id="canvas"></canvas>

  <div class="ui" id="ui">
    <header class="header">
      <p class="eyebrow">Universe of Love</p>
      <h1 class="title">Tap each photo</h1>
      <p class="hint">Every picture holds a little piece of my heart.</p>
      <p class="progress" id="progress">0 / 6 opened</p>
    </header>

    <div class="gallery" id="gallery"></div>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="msgTitle">
      <img id="msgImg" alt="" />
      <h2 id="msgTitle">A little note</h2>
      <p id="msgText"></p>
      <button type="button" id="msgClose">Got it</button>
    </div>
  </div>

  <section class="finale" id="finale" aria-hidden="true">
    <div class="finale-inner">
      <p class="eyebrow">Hey…</p>
      <h1>I like you.</h1>
      <p class="sub">Will you be my boyfriend?</p>
      <div class="choices">
        <button class="btn yes" id="btnYes" type="button">Yes</button>
        <button class="btn no" id="btnNo" type="button">No</button>
      </div>
    </div>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const MEMORIES = [
      {
        img: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=400&q=80",
        title: "Memory 1",
        text: "You make ordinary days feel special.",
      },
      {
        img: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?auto=format&fit=crop&w=400&q=80",
        title: "Memory 2",
        text: "I smile every time I think about you.",
      },
      {
        img: "https://images.unsplash.com/photo-1490750967868-88aa4486af60?auto=format&fit=crop&w=400&q=80",
        title: "Memory 3",
        text: "You're my favorite person to talk to.",
      },
      {
        img: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=400&q=80",
        title: "Memory 4",
        text: "My heart feels calm when you're around.",
      },
      {
        img: "https://images.unsplash.com/photo-1462275646964-a0251f6f6178?auto=format&fit=crop&w=400&q=80",
        title: "Memory 5",
        text: "I like you more than you know.",
      },
      {
        img: "https://images.unsplash.com/photo-1474552226712-ac0f0961a954?auto=format&fit=crop&w=400&q=80",
        title: "Memory 6",
        text: "Being with you feels like home.",
      },
    ];

    const gallery = document.getElementById("gallery");
    const progressEl = document.getElementById("progress");
    const modal = document.getElementById("modal");
    const msgImg = document.getElementById("msgImg");
    const msgTitle = document.getElementById("msgTitle");
    const msgText = document.getElementById("msgText");
    const msgClose = document.getElementById("msgClose");
    const ui = document.getElementById("ui");
    const finale = document.getElementById("finale");
    const canvasHeart = document.getElementById("canvas");
    const btnYes = document.getElementById("btnYes");
    const btnNo = document.getElementById("btnNo");

    const opened = new Set();

    MEMORIES.forEach((m, i) => {
      const btn = document.createElement("button");
      btn.className = "photo";
      btn.type = "button";
      btn.setAttribute("aria-label", `Open ${m.title}`);
      btn.innerHTML = `<img src="${m.img}" alt="${m.title}" loading="lazy" />`;
      btn.addEventListener("click", () => openMemory(i, btn));
      gallery.appendChild(btn);
    });

    function updateProgress() {
      progressEl.textContent = `${opened.size} / ${MEMORIES.length} opened`;
    }

    function openMemory(index, btn) {
      const m = MEMORIES[index];
      opened.add(index);
      btn.classList.add("opened");
      updateProgress();

      msgImg.src = m.img;
      msgImg.alt = m.title;
      msgTitle.textContent = m.title;
      msgText.textContent = m.text;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");

      if (opened.size >= MEMORIES.length) {
        setTimeout(showFinale, 350);
      }
    }

    function showFinale() {
      ui.classList.add("hidden");
      finale.classList.add("show");
      finale.setAttribute("aria-hidden", "false");
    }

    msgClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    // —— Starfield ——
    const starsCanvas = document.getElementById("stars");
    const sctx = starsCanvas.getContext("2d");
    let stars = [];

    function resizeStars() {
      starsCanvas.width = window.innerWidth;
      starsCanvas.height = window.innerHeight;
      stars = Array.from({ length: 120 }, () => ({
        x: Math.random() * starsCanvas.width,
        y: Math.random() * starsCanvas.height,
        r: Math.random() * 1.4 + 0.3,
        a: Math.random() * 0.7 + 0.2,
        tw: Math.random() * Math.PI * 2,
        sp: 0.008 + Math.random() * 0.02,
      }));
    }

    function drawStars(t) {
      sctx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
      for (const s of stars) {
        const twinkle = 0.45 + 0.55 * Math.sin(t * s.sp + s.tw);
        sctx.beginPath();
        sctx.fillStyle = `rgba(255, 210, 225, ${s.a * twinkle})`;
        sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        sctx.fill();
      }
      requestAnimationFrame(drawStars);
    }

    resizeStars();
    requestAnimationFrame(drawStars);
    window.addEventListener("resize", resizeStars);

    // —— Heart particles (Yes / No) ——
    const COUNT = 14000;
    const FORM_DURATION = 2.8;
    const SPIN_SPEED = 0.22;

    let unlocked = false;
    let mode = "yes";
    let forming = false;
    let formProgress = 0;
    let startTime = 0;
    let spinAmount = 0;
    let spinEase = 0;
    let breakGap = 0;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x120810, 0.028);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.2, 6.4);

    const renderer = new THREE.WebGLRenderer({
      canvas: canvasHeart,
      antialias: true,
      alpha: true,
      powerPreference: "high-performance",
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.78,
      0.58,
      0.16
    );
    composer.addPass(bloom);

    function insideHeart(x, y, z) {
      const a = x * x + 2.25 * y * y + z * z - 1;
      return a * a * a - x * x * z * z * z - 0.1125 * y * y * z * z * z <= 0;
    }

    function sampleHeartPoint() {
      let x, y, z, tries = 0;
      do {
        x = (Math.random() * 2 - 1) * 1.35;
        y = (Math.random() * 2 - 1) * 1.25;
        z = (Math.random() * 2 - 1) * 1.2;
        tries++;
      } while (!insideHeart(x, y, z) && tries < 90);

      if (tries >= 90) {
        const t = Math.random() * Math.PI * 2;
        const u = 0.65 + Math.random() * 0.35;
        x = 16 * Math.pow(Math.sin(t), 3) * 0.048 * u;
        z = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 0.048 * u;
        y = (Math.random() - 0.5) * 0.5;
        return new THREE.Vector3(x * 1.25, z * 1.25 + 0.3, y * 1.25);
      }
      return new THREE.Vector3(x * 1.4, z * 1.4 + 0.3, y * 1.4);
    }

    function randomScatter() {
      const r = 4 + Math.random() * 6;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      return new THREE.Vector3(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.sin(phi) * Math.sin(theta) * 0.65,
        r * Math.cos(phi)
      );
    }

    const targetsYes = new Float32Array(COUNT * 3);
    const targetsNo = new Float32Array(COUNT * 3);
    const starts = new Float32Array(COUNT * 3);
    const positions = new Float32Array(COUNT * 3);
    const colorsYes = new Float32Array(COUNT * 3);
    const colorsNo = new Float32Array(COUNT * 3);
    const colors = new Float32Array(COUNT * 3);
    const sizes = new Float32Array(COUNT);
    const phases = new Float32Array(COUNT);
    const sides = new Float32Array(COUNT);

    const cTip = new THREE.Color("#e0125a");
    const cMid = new THREE.Color("#ff3d8a");
    const cLobe = new THREE.Color("#ff7eb3");
    const cGlow = new THREE.Color("#ffc0d8");
    const cAsh = new THREE.Color("#8a6070");
    const cFade = new THREE.Color("#c48a9c");
    const cCrack = new THREE.Color("#5a3a48");
    const tmp = new THREE.Color();

    for (let i = 0; i < COUNT; i++) {
      const p = sampleHeartPoint();
      const s = randomScatter();
      const i3 = i * 3;

      targetsYes[i3] = p.x;
      targetsYes[i3 + 1] = p.y;
      targetsYes[i3 + 2] = p.z;

      const side = p.x >= 0 ? 1 : -1;
      sides[i] = side;
      targetsNo[i3] = p.x + side * 0.77;
      targetsNo[i3 + 1] = p.y + (side > 0 ? -0.08 : -0.18);
      targetsNo[i3 + 2] = p.z + side * 0.08;
      if (Math.abs(p.x) < 0.18) {
        targetsNo[i3] += side * 0.35;
        targetsNo[i3 + 1] -= 0.25 + Math.random() * 0.45;
      }

      starts[i3] = s.x;
      starts[i3 + 1] = s.y;
      starts[i3 + 2] = s.z;
      positions[i3] = s.x;
      positions[i3 + 1] = s.y;
      positions[i3 + 2] = s.z;

      const h = THREE.MathUtils.clamp((p.y + 1.1) / 2.6, 0, 1);
      const depth = THREE.MathUtils.clamp((p.z + 1.2) / 2.4, 0, 1);

      if (h < 0.28) tmp.copy(cTip).lerp(cMid, h / 0.28);
      else if (h < 0.58) tmp.copy(cMid).lerp(cLobe, (h - 0.28) / 0.3);
      else tmp.copy(cLobe).lerp(cGlow, (h - 0.58) / 0.42);
      tmp.multiplyScalar(0.95 + depth * 0.22);
      colorsYes[i3] = tmp.r;
      colorsYes[i3 + 1] = tmp.g;
      colorsYes[i3 + 2] = tmp.b;

      tmp.copy(cAsh).lerp(cFade, h);
      if (Math.abs(p.x) < 0.22) tmp.lerp(cCrack, 0.55);
      tmp.multiplyScalar(0.75 + depth * 0.2);
      colorsNo[i3] = tmp.r;
      colorsNo[i3 + 1] = tmp.g;
      colorsNo[i3 + 2] = tmp.b;

      colors[i3] = colorsYes[i3];
      colors[i3 + 1] = colorsYes[i3 + 1];
      colors[i3 + 2] = colorsYes[i3 + 2];
      sizes[i] = 0.012 + Math.random() * 0.03;
      phases[i] = Math.random() * Math.PI * 2;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));

    const material = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: true,
      uniforms: {
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
        uTime: { value: 0 },
      },
      vertexShader: `
        attribute float aSize;
        uniform float uPixelRatio;
        uniform float uTime;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vColor = color;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          float distFade = clamp(2.6 / max(-mv.z, 0.1), 0.45, 1.25);
          vAlpha = 0.9 + 0.1 * sin(uTime * 1.8 + position.x * 3.5);
          gl_PointSize = aSize * uPixelRatio * 255.0 * distFade;
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          float d = length(uv);
          if (d > 0.5) discard;
          float soft = pow(1.0 - smoothstep(0.0, 0.5, d), 1.45);
          float core = smoothstep(0.35, 0.0, d);
          vec3 col = vColor * (0.95 + core * 0.25);
          gl_FragColor = vec4(col, soft * vAlpha * 0.52);
        }
      `,
    });

    const heartGroup = new THREE.Group();
    heartGroup.add(new THREE.Points(geometry, material));
    scene.add(heartGroup);

    const baseMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color("#ff3d8a"),
      transparent: true,
      opacity: 0.22,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const base = new THREE.Mesh(new THREE.RingGeometry(0.4, 1.95, 128), baseMat);
    base.rotation.x = -Math.PI / 2;
    base.position.y = -1.6;
    base.visible = false;
    scene.add(base);

    const baseInnerMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color("#ff9ec0"),
      transparent: true,
      opacity: 0.2,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const baseInner = new THREE.Mesh(new THREE.CircleGeometry(0.55, 64), baseInnerMat);
    baseInner.rotation.x = -Math.PI / 2;
    baseInner.position.y = -1.59;
    baseInner.visible = false;
    scene.add(baseInner);

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function activeTargets() {
      return mode === "yes" ? targetsYes : targetsNo;
    }

    function applyColors() {
      const src = mode === "yes" ? colorsYes : colorsNo;
      const arr = geometry.attributes.color.array;
      for (let i = 0; i < COUNT * 3; i++) arr[i] = src[i];
      geometry.attributes.color.needsUpdate = true;
      if (mode === "yes") {
        baseMat.color.set("#ff3d8a");
        bloom.strength = 0.78;
        renderer.toneMappingExposure = 1.05;
      } else {
        baseMat.color.set("#8a6070");
        bloom.strength = 0.4;
        renderer.toneMappingExposure = 0.85;
      }
    }

    function updateFormation(t) {
      const pos = geometry.attributes.position.array;
      const targets = activeTargets();
      for (let i = 0; i < COUNT; i++) {
        const i3 = i * 3;
        const stagger = (i % 260) / 260;
        const local = Math.min(1, Math.max(0, (t - stagger * 0.4) / 0.6));
        const e = easeInOutCubic(local);
        pos[i3] = starts[i3] + (targets[i3] - starts[i3]) * e;
        pos[i3 + 1] = starts[i3 + 1] + (targets[i3 + 1] - starts[i3 + 1]) * e;
        pos[i3 + 2] = starts[i3 + 2] + (targets[i3 + 2] - starts[i3 + 2]) * e;
      }
      geometry.attributes.position.needsUpdate = true;
    }

    function animateHeart(time) {
      const pos = geometry.attributes.position.array;
      const targets = activeTargets();
      if (mode === "yes") {
        for (let i = 0; i < COUNT; i++) {
          const i3 = i * 3;
          const breath = 1 + Math.sin(time * 1.15 + phases[i]) * 0.01;
          pos[i3] = targets[i3] * breath;
          pos[i3 + 1] = targets[i3 + 1] * breath;
          pos[i3 + 2] = targets[i3 + 2] * breath;
        }
      } else {
        breakGap = Math.min(0.55, breakGap + 0.0022);
        for (let i = 0; i < COUNT; i++) {
          const i3 = i * 3;
          const side = sides[i];
          const shake = Math.sin(time * 3.2 + phases[i]) * 0.012;
          pos[i3] = targets[i3] + side * breakGap + shake * side;
          pos[i3 + 1] = targets[i3 + 1] - breakGap * 0.25;
          pos[i3 + 2] = targets[i3 + 2];
        }
      }
      geometry.attributes.position.needsUpdate = true;
    }

    const clock = new THREE.Clock();
    let last = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const delta = Math.min(0.05, (now - last) / 1000);
      last = now;
      const elapsed = clock.getElapsedTime();
      material.uniforms.uTime.value = elapsed;

      if (unlocked) {
        if (forming) {
          formProgress = Math.min(1, (performance.now() - startTime) / (FORM_DURATION * 1000));
          updateFormation(formProgress);
          spinEase = THREE.MathUtils.damp(spinEase, mode === "yes" ? 0.35 : 0.12, 1.2, delta);
          if (formProgress >= 1) forming = false;
        } else {
          animateHeart(elapsed);
          spinEase = THREE.MathUtils.damp(spinEase, mode === "yes" ? 1 : 0.35, 1.8, delta);
        }

        spinAmount += SPIN_SPEED * spinEase * delta;
        heartGroup.rotation.y = spinAmount;
        heartGroup.rotation.x = Math.sin(spinAmount * 0.55) * (mode === "yes" ? 0.1 : 0.06);

        camera.position.x = Math.sin(elapsed * 0.12) * 0.15;
        camera.position.y = 0.2 + Math.sin(elapsed * 0.18) * 0.06;
        camera.lookAt(0, 0.15, 0);

        base.rotation.z = elapsed * 0.18;
        baseInner.rotation.z = -elapsed * 0.12;
        const pulse = (mode === "yes" ? 0.2 : 0.08) + Math.sin(elapsed * 1.2) * 0.04;
        baseMat.opacity = pulse;
        baseInnerMat.opacity = pulse * 0.85;
      }

      composer.render();
    }
    requestAnimationFrame(animate);

    function unlock(choice) {
      if (unlocked) return;
      unlocked = true;
      mode = choice;
      forming = true;
      formProgress = 0;
      startTime = performance.now();
      spinEase = 0;
      spinAmount = 0;
      breakGap = 0;

      applyColors();
      finale.classList.add("gone");
      finale.setAttribute("aria-hidden", "true");
      canvasHeart.classList.add("on");
      base.visible = true;
      baseInner.visible = true;
    }

    btnYes.addEventListener("click", () => unlock("yes"));
    btnNo.addEventListener("click", () => unlock("no"));

    window.addEventListener("resize", () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      material.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
      bloom.setSize(w, h);
    });
  </script>
</body>
</html>
