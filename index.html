<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Universe of Love</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Outfit", sans-serif;
      color: #fff;
      touch-action: none;
    }
    #c {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 5;
      padding: 1.1rem 1rem 0;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    .hud.hidden { opacity: 0; }
    .hud h1 {
      font-size: clamp(1.25rem, 4.8vw, 1.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      text-shadow: 0 0 22px rgba(255, 120, 180, 0.7);
    }
    .hud p {
      margin-top: 0.35rem;
      font-size: 0.92rem;
      color: rgba(255, 210, 230, 0.78);
    }
    .hud .progress {
      margin-top: 0.45rem;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      color: rgba(255, 160, 200, 0.9);
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal.open { opacity: 1; visibility: visible; }
    .modal-card {
      width: min(100%, 340px);
      background: linear-gradient(165deg, #fff7fa, #ffe4ee);
      color: #5c2a3d;
      border-radius: 22px;
      padding: 1.5rem 1.3rem 1.25rem;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      transform: translateY(12px) scale(0.96);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .modal.open .modal-card { transform: none; }
    .modal-emoji {
      font-size: 3.2rem;
      line-height: 1;
      margin-bottom: 0.7rem;
      filter: drop-shadow(0 8px 16px rgba(232, 90, 140, 0.35));
    }
    .modal-card h2 {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(92, 42, 61, 0.5);
      margin-bottom: 0.45rem;
    }
    .modal-card p {
      font-size: clamp(1.15rem, 4.4vw, 1.4rem);
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 1.2rem;
    }
    .modal-card button {
      appearance: none;
      border: none;
      background: #e85a8c;
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.78rem 1.5rem;
      border-radius: 12px;
      cursor: pointer;
    }
    .finale {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    .finale.show { opacity: 1; visibility: visible; }
    .finale.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    .finale-inner { text-align: center; max-width: 400px; }
    .finale .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 200, 220, 0.65);
      margin-bottom: 0.55rem;
    }
    .finale h1 {
      font-size: clamp(1.9rem, 7vw, 2.55rem);
      font-weight: 700;
      margin-bottom: 0.45rem;
      text-shadow: 0 0 28px rgba(255, 100, 160, 0.55);
    }
    .finale .sub {
      color: rgba(255, 220, 230, 0.82);
      margin-bottom: 1.7rem;
      font-size: 1.08rem;
    }
    .choices {
      display: flex;
      gap: 0.85rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      appearance: none;
      border: none;
      background: #e85a8c;
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.9rem 2rem;
      min-width: 128px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 0 28px rgba(232, 90, 140, 0.45);
    }
    .btn.no {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 220, 230, 0.35);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud" id="hud">
    <h1>Universe of Love</h1>
    <p>Tap the cute icons orbiting the heart</p>
    <p class="progress" id="progress">0 / 6 opened</p>
  </div>

  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-emoji" id="msgEmoji">🎀</div>
      <h2 id="msgTitle">A little note</h2>
      <p id="msgText"></p>
      <button type="button" id="msgClose">Got it</button>
    </div>
  </div>

  <section class="finale" id="finale">
    <div class="finale-inner">
      <p class="eyebrow">Hey…</p>
      <h1>I like you.</h1>
      <p class="sub">Will you be my boyfriend?</p>
      <div class="choices">
        <button class="btn" id="btnYes" type="button">Yes</button>
        <button class="btn no" id="btnNo" type="button">No</button>
      </div>
    </div>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const ICONS = [
      { kind: "hellokitty", label: "Hello Kitty", text: "You make my world feel soft and sweet." },
      { kind: "emoji", emoji: "🕷️", label: "Hero", text: "I smile every time I think of you." },
      { kind: "emoji", emoji: "🍓", label: "Strawberry", text: "You're my favorite kind of happiness." },
      { kind: "emoji", emoji: "🌸", label: "Sakura", text: "My heart blooms whenever you're near." },
      { kind: "emoji", emoji: "🧸", label: "Teddy", text: "I feel safe and warm with you." },
      { kind: "emoji", emoji: "💘", label: "Cupid", text: "I like you more than words can say." },
    ];

    const FLOAT_WORDS = [
      "I LIKE YOU",
      "YOU'RE MAGIC",
      "ALWAYS TOGETHER",
      "MY HEART",
      "FOREVER",
      "BE MINE",
    ];

    const canvas = document.getElementById("c");
    const hud = document.getElementById("hud");
    const progressEl = document.getElementById("progress");
    const modal = document.getElementById("modal");
    const msgEmoji = document.getElementById("msgEmoji");
    const msgTitle = document.getElementById("msgTitle");
    const msgText = document.getElementById("msgText");
    const msgClose = document.getElementById("msgClose");
    const finale = document.getElementById("finale");
    const btnYes = document.getElementById("btnYes");
    const btnNo = document.getElementById("btnNo");

    const opened = new Set();
    let paused = false;
    let finaleMode = false; // after yes/no choice
    let answer = null; // "yes" | "no"

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050308, 0.018);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 10, 22);
    camera.lookAt(0, 1.5, 0);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: "high-performance",
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.95,
      0.55,
      0.12
    );
    composer.addPass(bloom);

    const root = new THREE.Group();
    scene.add(root);

    // —— Stars ——
    {
      const n = 1800;
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const r = 40 + Math.random() * 80;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
        pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th) * 0.55;
        pos[i * 3 + 2] = r * Math.cos(ph);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      const stars = new THREE.Points(
        geo,
        new THREE.PointsMaterial({
          color: 0xffd0e4,
          size: 0.08,
          transparent: true,
          opacity: 0.75,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      );
      scene.add(stars);
    }

    // —— Spiral galaxy ——
    function makeGalaxy() {
      const count = 9000;
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const c1 = new THREE.Color("#ff4da6");
      const c2 = new THREE.Color("#c44dff");
      const c3 = new THREE.Color("#ff9ec8");
      const tmp = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const arm = i % 3;
        const t = i / count;
        const radius = Math.pow(t, 0.65) * 14;
        const spin = radius * 0.55 + arm * ((Math.PI * 2) / 3);
        const angle = spin + t * Math.PI * 4;
        const spread = (Math.random() - 0.5) * (0.35 + radius * 0.08);

        pos[i * 3] = Math.cos(angle) * radius + Math.cos(angle) * spread;
        pos[i * 3 + 2] = Math.sin(angle) * radius + Math.sin(angle) * spread;
        pos[i * 3 + 1] = (Math.random() - 0.5) * (0.35 + (1 - t) * 0.8);

        if (t < 0.35) tmp.copy(c2).lerp(c1, t / 0.35);
        else tmp.copy(c1).lerp(c3, (t - 0.35) / 0.65);
        tmp.multiplyScalar(0.85 + Math.random() * 0.35);
        col[i * 3] = tmp.r;
        col[i * 3 + 1] = tmp.g;
        col[i * 3 + 2] = tmp.b;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size: 0.12,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        sizeAttenuation: true,
      });
      const galaxy = new THREE.Points(geo, mat);
      galaxy.rotation.x = -0.55;
      root.add(galaxy);
      return galaxy;
    }
    const galaxy = makeGalaxy();

    // —— Central particle heart ——
    function insideHeart(x, y, z) {
      const a = x * x + 2.25 * y * y + z * z - 1;
      return a * a * a - x * x * z * z * z - 0.1125 * y * y * z * z * z <= 0;
    }

    function makeCenterHeart(broken = false) {
      const count = 7000;
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      const cTip = new THREE.Color("#ff1f6b");
      const cMid = new THREE.Color("#ff4d9a");
      const cTop = new THREE.Color("#ffb0d4");
      const tmp = new THREE.Color();

      let i = 0;
      while (i < count) {
        let x = (Math.random() * 2 - 1) * 1.3;
        let y = (Math.random() * 2 - 1) * 1.2;
        let z = (Math.random() * 2 - 1) * 1.15;
        if (!insideHeart(x, y, z)) continue;

        // algebraic heart points along Z → map to Y up
        let px = x * 2.1;
        let py = z * 2.1 + 2.4;
        let pz = y * 2.1;

        if (broken) {
          const side = px >= 0 ? 1 : -1;
          px += side * 1.35;
          py -= 0.35;
          if (Math.abs(x) < 0.2) {
            px += side * 0.5;
            py -= 0.6 + Math.random() * 0.5;
          }
        }

        const i3 = i * 3;
        pos[i3] = px;
        pos[i3 + 1] = py;
        pos[i3 + 2] = pz;

        const h = THREE.MathUtils.clamp((py - 0.5) / 4.5, 0, 1);
        if (h < 0.4) tmp.copy(cTip).lerp(cMid, h / 0.4);
        else tmp.copy(cMid).lerp(cTop, (h - 0.4) / 0.6);
        if (broken) tmp.lerp(new THREE.Color("#6a4a58"), 0.45);
        col[i3] = tmp.r;
        col[i3 + 1] = tmp.g;
        col[i3 + 2] = tmp.b;
        i++;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
      const mat = new THREE.PointsMaterial({
        size: broken ? 0.09 : 0.11,
        vertexColors: true,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const heart = new THREE.Points(geo, mat);
      root.add(heart);
      return heart;
    }

    let centerHeart = makeCenterHeart(false);

    // —— Orbiting small hearts (like the VT code) ——
    function makeHeartShape() {
      const s = new THREE.Shape();
      s.moveTo(0, -0.7);
      s.bezierCurveTo(-0.9, -0.2, -0.9, 0.7, 0, 0.35);
      s.bezierCurveTo(0.9, 0.7, 0.9, -0.2, 0, -0.7);
      return s;
    }

    const heartGeo = new THREE.ExtrudeGeometry(makeHeartShape(), {
      depth: 0.25,
      bevelEnabled: true,
      bevelThickness: 0.08,
      bevelSize: 0.06,
      bevelSegments: 2,
      curveSegments: 12,
    });
    heartGeo.center();
    heartGeo.rotateX(Math.PI); // tip down → tip up-ish after rotation
    heartGeo.scale(0.55, 0.55, 0.55);

    const heartMat = new THREE.MeshBasicMaterial({
      color: 0xff3d7a,
      transparent: true,
      opacity: 0.95,
    });

    const orbitHearts = [];
    for (let i = 0; i < 48; i++) {
      const heartMesh = new THREE.Mesh(heartGeo, heartMat.clone());
      heartMesh.material.color.setHSL(0.92 + Math.random() * 0.06, 0.9, 0.55 + Math.random() * 0.15);
      heartMesh.userData = {
        radius: 4 + Math.random() * 14,
        angle: Math.random() * Math.PI * 2,
        ySpeed: 0.2 + Math.random() * 0.6,
        yOffset: -3 + Math.random() * 6,
        spin: randSpin(),
      };
      heartMesh.position.x = Math.cos(heartMesh.userData.angle) * heartMesh.userData.radius;
      heartMesh.position.z = Math.sin(heartMesh.userData.angle) * heartMesh.userData.radius;
      heartMesh.position.y = heartMesh.userData.yOffset;
      heartMesh.scale.setScalar(0.35 + Math.random() * 0.45);
      root.add(heartMesh);
      orbitHearts.push(heartMesh);
    }

    function randSpin() {
      return (Math.random() - 0.5) * 1.5;
    }

    // —— Clickable icon sprites (Hello Kitty etc.) ——
    function drawBadgeBase(g, size) {
      const grd = g.createRadialGradient(size * 0.35, size * 0.3, 10, size * 0.5, size * 0.5, size * 0.48);
      grd.addColorStop(0, "#ffffff");
      grd.addColorStop(0.55, "#ffe4f0");
      grd.addColorStop(1, "#ff8fbc");
      g.fillStyle = grd;
      g.beginPath();
      g.arc(size / 2, size / 2, size * 0.46, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = "rgba(255,255,255,0.95)";
      g.lineWidth = 10;
      g.stroke();
    }

    function makeHelloKittyTexture() {
      const size = 256;
      const c = document.createElement("canvas");
      c.width = size;
      c.height = size;
      const g = c.getContext("2d");
      drawBadgeBase(g, size);

      const cx = size / 2;
      const cy = size / 2 + 10;

      // ears
      g.fillStyle = "#fff";
      g.beginPath();
      g.ellipse(cx - 48, cy - 52, 28, 36, -0.25, 0, Math.PI * 2);
      g.ellipse(cx + 48, cy - 52, 28, 36, 0.25, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = "#222";
      g.lineWidth = 5;
      g.stroke();

      // head
      g.beginPath();
      g.ellipse(cx, cy, 70, 62, 0, 0, Math.PI * 2);
      g.fillStyle = "#fff";
      g.fill();
      g.stroke();

      // bow
      g.fillStyle = "#ff3b6e";
      g.beginPath();
      g.ellipse(cx + 42, cy - 48, 22, 16, 0.4, 0, Math.PI * 2);
      g.ellipse(cx + 68, cy - 40, 22, 16, -0.2, 0, Math.PI * 2);
      g.fill();
      g.beginPath();
      g.arc(cx + 55, cy - 44, 8, 0, Math.PI * 2);
      g.fill();

      // eyes + nose + whiskers
      g.fillStyle = "#222";
      g.beginPath();
      g.ellipse(cx - 24, cy + 4, 7, 10, 0, 0, Math.PI * 2);
      g.ellipse(cx + 24, cy + 4, 7, 10, 0, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = "#ffb4c8";
      g.beginPath();
      g.ellipse(cx, cy + 18, 7, 5, 0, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = "#222";
      g.lineWidth = 3;
      [[-55, 8], [-55, 20], [-55, 32], [55, 8], [55, 20], [55, 32]].forEach(([x, y], i) => {
        g.beginPath();
        g.moveTo(cx + (i < 3 ? -18 : 18), cy + 12);
        g.lineTo(cx + x * 0.7, cy + y - 4);
        g.stroke();
      });

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeEmojiTexture(emoji) {
      const size = 256;
      const c = document.createElement("canvas");
      c.width = size;
      c.height = size;
      const g = c.getContext("2d");
      drawBadgeBase(g, size);
      g.font = "140px serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText(emoji, size / 2, size / 2 + 8);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const iconMeshes = [];
    ICONS.forEach((icon, index) => {
      const tex = icon.kind === "hellokitty" ? makeHelloKittyTexture() : makeEmojiTexture(icon.emoji);
      const mat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
      });
      const sprite = new THREE.Sprite(mat);
      const radius = 6.5 + (index % 3) * 2.8;
      const angle = (index / ICONS.length) * Math.PI * 2;
      sprite.userData = {
        type: "icon",
        index,
        icon,
        radius,
        angle,
        ySpeed: 0.35 + Math.random() * 0.35,
        yOffset: -1.2 + (index % 3) * 1.4,
        opened: false,
      };
      sprite.scale.set(2.1, 2.1, 1);
      sprite.position.set(
        Math.cos(angle) * radius,
        sprite.userData.yOffset,
        Math.sin(angle) * radius
      );
      root.add(sprite);
      iconMeshes.push(sprite);
    });

    // —— Orbiting romantic words ——
    function makeTextTexture(text) {
      const c = document.createElement("canvas");
      c.width = 512;
      c.height = 128;
      const g = c.getContext("2d");
      g.clearRect(0, 0, c.width, c.height);
      g.font = "bold 52px Outfit, sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.shadowColor = "rgba(255, 80, 150, 0.9)";
      g.shadowBlur = 18;
      g.fillStyle = "#ffd0e6";
      g.fillText(text, c.width / 2, c.height / 2);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const wordSprites = [];
    FLOAT_WORDS.forEach((word, index) => {
      const sprite = new THREE.Sprite(
        new THREE.SpriteMaterial({
          map: makeTextTexture(word),
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        })
      );
      sprite.userData = {
        radius: 8 + (index % 4) * 2.2,
        angle: (index / FLOAT_WORDS.length) * Math.PI * 2 + 0.4,
        yOffset: -2 + (index % 4) * 1.3,
        ySpeed: 0.25 + Math.random() * 0.3,
      };
      sprite.scale.set(4.2, 1.05, 1);
      root.add(sprite);
      wordSprites.push(sprite);
    });

    // —— Interaction ——
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let hovered = null;

    function setPointer(e) {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      pointer.x = (x / window.innerWidth) * 2 - 1;
      pointer.y = -(y / window.innerHeight) * 2 + 1;
    }

    function pickIcon() {
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(iconMeshes, false);
      return hits.length ? hits[0].object : null;
    }

    function updateProgress() {
      progressEl.textContent = `${opened.size} / ${ICONS.length} opened`;
    }

    function openIcon(sprite) {
      const { index, icon } = sprite.userData;
      opened.add(index);
      sprite.userData.opened = true;
      sprite.material.opacity = 0.55;
      updateProgress();

      msgEmoji.textContent = icon.kind === "hellokitty" ? "🎀" : icon.emoji;
      msgTitle.textContent = icon.label;
      msgText.textContent = icon.text;
      modal.classList.add("open");
      paused = true;
    }

    function closeModal() {
      modal.classList.remove("open");
      paused = false;
      if (opened.size >= ICONS.length && !finaleMode && answer === null) {
        setTimeout(() => {
          hud.classList.add("hidden");
          finale.classList.add("show");
        }, 280);
      }
    }

    window.addEventListener("pointermove", (e) => {
      if (paused || finale.classList.contains("show") || finaleMode) return;
      setPointer(e);
      const hit = pickIcon();
      if (hovered && hovered !== hit) hovered.scale.set(2.1, 2.1, 1);
      hovered = hit;
      if (hovered) {
        hovered.scale.set(2.55, 2.55, 1);
        canvas.style.cursor = "pointer";
      } else {
        canvas.style.cursor = "default";
      }
    });

    window.addEventListener("pointerdown", (e) => {
      if (paused || finale.classList.contains("show") || finaleMode) return;
      setPointer(e);
      const hit = pickIcon();
      if (hit) openIcon(hit);
    });

    msgClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    function choose(choice) {
      answer = choice;
      finaleMode = true;
      finale.classList.add("gone");
      hud.classList.add("hidden");

      root.remove(centerHeart);
      centerHeart.geometry.dispose();
      centerHeart.material.dispose();
      centerHeart = makeCenterHeart(choice === "no");
      bloom.strength = choice === "yes" ? 1.05 : 0.55;
      bloom.threshold = choice === "yes" ? 0.1 : 0.25;
    }

    btnYes.addEventListener("click", () => choose("yes"));
    btnNo.addEventListener("click", () => choose("no"));

    // —— Animate ——
    const clock = new THREE.Clock();
    let camAngle = 0.35;
    let lastT = 0;

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const delta = Math.min(0.05, t - lastT);
      lastT = t;

      if (!paused) {
        galaxy.rotation.z = t * 0.08;
        if (centerHeart) {
          centerHeart.rotation.y = t * 0.35;
          const breath = 1 + Math.sin(t * 1.6) * 0.03;
          centerHeart.scale.setScalar(breath);
          if (answer === "no") {
            centerHeart.rotation.z = Math.sin(t * 1.2) * 0.08;
          }
        }

        for (const h of orbitHearts) {
          const d = h.userData;
          d.angle += delta * (0.15 + (1 / d.radius) * 0.8);
          h.position.x = Math.cos(d.angle) * d.radius;
          h.position.z = Math.sin(d.angle) * d.radius;
          h.position.y = d.yOffset + Math.sin(t * d.ySpeed + d.angle) * 0.45;
          h.rotation.y += delta * d.spin;
          h.rotation.x += delta * 0.4;
        }

        for (const s of iconMeshes) {
          const d = s.userData;
          d.angle += delta * (0.22 + (1 / d.radius) * 0.35);
          s.position.x = Math.cos(d.angle) * d.radius;
          s.position.z = Math.sin(d.angle) * d.radius;
          s.position.y = d.yOffset + Math.sin(t * d.ySpeed + d.angle) * 0.55;
        }

        for (const s of wordSprites) {
          const d = s.userData;
          d.angle += delta * 0.12;
          s.position.x = Math.cos(d.angle) * d.radius;
          s.position.z = Math.sin(d.angle) * d.radius;
          s.position.y = d.yOffset + Math.sin(t * d.ySpeed) * 0.35;
          s.material.opacity = 0.55 + Math.sin(t * 2 + d.angle) * 0.25;
        }

        // slow cinematic orbit camera
        camAngle += delta * 0.12;
        const camR = 22;
        camera.position.x = Math.sin(camAngle) * camR;
        camera.position.z = Math.cos(camAngle) * camR;
        camera.position.y = 9.5 + Math.sin(t * 0.35) * 0.8;
        camera.lookAt(0, 1.8, 0);
      }

      composer.render();
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloom.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
