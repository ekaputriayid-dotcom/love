<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do You Love Me?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pink: #ff7aa8;
      --blush: #ffe4ec;
      --glow: rgba(255, 122, 168, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--blush);
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    body {
      background:
        radial-gradient(ellipse 55% 45% at 50% 58%, rgba(255, 80, 130, 0.08), transparent 70%),
        #000;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0;
      transition: opacity 1.4s ease;
      z-index: 0;
    }

    #canvas.on { opacity: 1; }

    .vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 42%, transparent 28%, rgba(0, 0, 0, 0.75) 100%);
      z-index: 1;
    }

    .stage {
      position: relative;
      z-index: 2;
      width: min(92vw, 520px);
      text-align: center;
      padding: 2rem 1.25rem;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0 auto;
    }

    .prompt {
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .prompt.hidden {
      opacity: 0;
      transform: translateY(-12px) scale(0.97);
      pointer-events: none;
    }

    .question {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2.6rem, 10vw, 4.2rem);
      line-height: 1.15;
      background: linear-gradient(120deg, #ffe4ec, #ff7aa8, #ffb3c9, #ffe4ec);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 6s linear infinite;
      margin-bottom: 0.6rem;
    }

    .sub {
      font-size: clamp(1rem, 2.8vw, 1.2rem);
      font-style: italic;
      color: rgba(255, 179, 201, 0.55);
      letter-spacing: 0.06em;
      margin-bottom: 2.4rem;
    }

    .choices {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(255, 122, 168, 0.45);
      background: linear-gradient(180deg, rgba(255, 122, 168, 0.16), rgba(255, 122, 168, 0.05));
      color: #ffe4ec;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.15rem, 3.5vw, 1.4rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.95rem 2.1rem;
      min-width: 140px;
      cursor: pointer;
      border-radius: 999px;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .btn:hover, .btn:focus-visible {
      outline: none;
      transform: translateY(-2px);
      border-color: rgba(255, 154, 186, 0.9);
      box-shadow: 0 12px 36px -16px var(--glow);
      background: linear-gradient(180deg, rgba(255, 122, 168, 0.28), rgba(255, 122, 168, 0.08));
    }

    .btn.no {
      border-color: rgba(180, 140, 160, 0.4);
      background: linear-gradient(180deg, rgba(120, 90, 110, 0.22), rgba(80, 60, 75, 0.08));
      color: rgba(255, 220, 230, 0.75);
    }

    .btn.no:hover, .btn.no:focus-visible {
      border-color: rgba(200, 160, 180, 0.7);
      box-shadow: 0 12px 36px -18px rgba(180, 120, 150, 0.45);
    }

    .btn:active { transform: translateY(0) scale(0.98); }

    @keyframes shimmer {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <section class="prompt" id="prompt">
      <h1 class="question">Do you love me?</h1>
      <p class="sub">Choose with your heart</p>
      <div class="choices">
        <button class="btn yes" id="btnYes" type="button">Yes</button>
        <button class="btn no" id="btnNo" type="button">No</button>
      </div>
    </section>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const COUNT = 16000;
    const FORM_DURATION = 2.8;
    const SPIN_SPEED = 0.22;

    const prompt = document.getElementById("prompt");
    const canvas = document.getElementById("canvas");
    const btnYes = document.getElementById("btnYes");
    const btnNo = document.getElementById("btnNo");

    let unlocked = false;
    let mode = "yes"; // "yes" | "no"
    let forming = false;
    let formProgress = 0;
    let startTime = 0;
    let spinAmount = 0;
    let spinEase = 0;
    let breakGap = 0;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.028);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.2, 6.4);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: "high-performance",
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.55,
      0.48,
      0.28
    );
    composer.addPass(bloom);

    function insideHeart(x, y, z) {
      const a = x * x + 2.25 * y * y + z * z - 1;
      return a * a * a - x * x * z * z * z - 0.1125 * y * y * z * z * z <= 0;
    }

    function sampleHeartPoint() {
      let x, y, z;
      let tries = 0;
      do {
        x = (Math.random() * 2 - 1) * 1.35;
        y = (Math.random() * 2 - 1) * 1.25;
        z = (Math.random() * 2 - 1) * 1.2;
        tries++;
      } while (!insideHeart(x, y, z) && tries < 90);

      if (tries >= 90) {
        const t = Math.random() * Math.PI * 2;
        const u = 0.65 + Math.random() * 0.35;
        x = 16 * Math.pow(Math.sin(t), 3) * 0.048 * u;
        z = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 0.048 * u;
        y = (Math.random() - 0.5) * 0.5;
        return new THREE.Vector3(x * 1.25, z * 1.25 + 0.3, y * 1.25);
      }

      return new THREE.Vector3(x * 1.4, z * 1.4 + 0.3, y * 1.4);
    }

    function randomScatter() {
      const r = 4 + Math.random() * 6;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      return new THREE.Vector3(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.sin(phi) * Math.sin(theta) * 0.65,
        r * Math.cos(phi)
      );
    }

    const targetsYes = new Float32Array(COUNT * 3);
    const targetsNo = new Float32Array(COUNT * 3);
    const starts = new Float32Array(COUNT * 3);
    const positions = new Float32Array(COUNT * 3);
    const colorsYes = new Float32Array(COUNT * 3);
    const colorsNo = new Float32Array(COUNT * 3);
    const colors = new Float32Array(COUNT * 3);
    const sizes = new Float32Array(COUNT);
    const phases = new Float32Array(COUNT);
    const sides = new Float32Array(COUNT); // -1 left, 1 right for broken heart

    const cDeep = new THREE.Color("#c9184a");
    const cRose = new THREE.Color("#ff4d8d");
    const cSoft = new THREE.Color("#ff9ec0");
    const cBlush = new THREE.Color("#ffc2d6");
    const cAsh = new THREE.Color("#8a6070");
    const cFade = new THREE.Color("#c48a9c");
    const cCrack = new THREE.Color("#5a3a48");
    const tmp = new THREE.Color();

    for (let i = 0; i < COUNT; i++) {
      const p = sampleHeartPoint();
      const s = randomScatter();
      const i3 = i * 3;

      // whole heart target
      targetsYes[i3] = p.x;
      targetsYes[i3 + 1] = p.y;
      targetsYes[i3 + 2] = p.z;

      // broken heart: clear left/right halves with a crack gap
      const side = p.x >= 0 ? 1 : -1;
      sides[i] = side;
      const crack = 0.22; // visible gap down the middle
      const outward = 0.55; // halves pull apart
      const drop = side > 0 ? -0.08 : -0.18;
      const tiltZ = side * 0.12;

      targetsNo[i3] = p.x + side * (outward + crack);
      targetsNo[i3 + 1] = p.y + drop + Math.abs(p.x) * tiltZ * 0.15;
      targetsNo[i3 + 2] = p.z + side * 0.08;

      // carve a jagged crack: push points near center further apart + downward shards
      if (Math.abs(p.x) < 0.18) {
        targetsNo[i3] += side * 0.35;
        targetsNo[i3 + 1] -= 0.25 + Math.random() * 0.45;
        targetsNo[i3 + 2] += (Math.random() - 0.5) * 0.2;
      }

      starts[i3] = s.x;
      starts[i3 + 1] = s.y;
      starts[i3 + 2] = s.z;

      positions[i3] = s.x;
      positions[i3 + 1] = s.y;
      positions[i3 + 2] = s.z;

      const h = THREE.MathUtils.clamp((p.y + 1.1) / 2.6, 0, 1);
      const depth = THREE.MathUtils.clamp((p.z + 1.2) / 2.4, 0, 1);

      // yes colors — warm romantic pink
      if (h < 0.35) tmp.copy(cDeep).lerp(cRose, h / 0.35);
      else if (h < 0.7) tmp.copy(cRose).lerp(cSoft, (h - 0.35) / 0.35);
      else tmp.copy(cSoft).lerp(cBlush, (h - 0.7) / 0.3);
      tmp.multiplyScalar(0.82 + depth * 0.28);
      colorsYes[i3] = tmp.r;
      colorsYes[i3 + 1] = tmp.g;
      colorsYes[i3 + 2] = tmp.b;

      // no colors — faded / ashen pink, darker near crack
      tmp.copy(cAsh).lerp(cFade, h);
      if (Math.abs(p.x) < 0.22) tmp.lerp(cCrack, 0.55);
      tmp.multiplyScalar(0.7 + depth * 0.2);
      colorsNo[i3] = tmp.r;
      colorsNo[i3 + 1] = tmp.g;
      colorsNo[i3 + 2] = tmp.b;

      colors[i3] = colorsYes[i3];
      colors[i3 + 1] = colorsYes[i3 + 1];
      colors[i3 + 2] = colorsYes[i3 + 2];

      sizes[i] = 0.01 + Math.random() * 0.026 + (1 - h) * 0.006;
      phases[i] = Math.random() * Math.PI * 2;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));

    const material = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: true,
      uniforms: {
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
        uTime: { value: 0 },
      },
      vertexShader: `
        attribute float aSize;
        uniform float uPixelRatio;
        uniform float uTime;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vColor = color;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          float distFade = clamp(2.5 / max(-mv.z, 0.1), 0.4, 1.2);
          float twinkle = 0.88 + 0.12 * sin(uTime * 1.6 + position.x * 3.5 + position.y * 2.8);
          vAlpha = twinkle;
          gl_PointSize = aSize * uPixelRatio * 220.0 * distFade;
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          float d = length(uv);
          if (d > 0.5) discard;
          float soft = pow(1.0 - smoothstep(0.0, 0.5, d), 1.6);
          vec3 col = vColor * 0.78;
          gl_FragColor = vec4(col, soft * vAlpha * 0.38);
        }
      `,
    });

    const heartGroup = new THREE.Group();
    const points = new THREE.Points(geometry, material);
    heartGroup.add(points);
    scene.add(heartGroup);

    const baseGeo = new THREE.RingGeometry(0.4, 1.95, 128);
    const baseMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color("#ff6b9d"),
      transparent: true,
      opacity: 0.14,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.rotation.x = -Math.PI / 2;
    base.position.y = -1.6;
    base.visible = false;
    scene.add(base);

    const baseInnerGeo = new THREE.CircleGeometry(0.55, 64);
    const baseInnerMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color("#ff8fb3"),
      transparent: true,
      opacity: 0.12,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const baseInner = new THREE.Mesh(baseInnerGeo, baseInnerMat);
    baseInner.rotation.x = -Math.PI / 2;
    baseInner.position.y = -1.59;
    baseInner.visible = false;
    scene.add(baseInner);

    const dustCount = 1000;
    const dustPos = new Float32Array(dustCount * 3);
    const dustCol = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount; i++) {
      dustPos[i * 3] = (Math.random() - 0.5) * 16;
      dustPos[i * 3 + 1] = (Math.random() - 0.5) * 11;
      dustPos[i * 3 + 2] = (Math.random() - 0.5) * 16;
      const shade = 0.55 + Math.random() * 0.45;
      dustCol[i * 3] = shade;
      dustCol[i * 3 + 1] = shade * 0.55;
      dustCol[i * 3 + 2] = shade * 0.68;
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
    dustGeo.setAttribute("color", new THREE.BufferAttribute(dustCol, 3));
    const dustMat = new THREE.PointsMaterial({
      size: 0.016,
      transparent: true,
      opacity: 0.35,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const dust = new THREE.Points(dustGeo, dustMat);
    dust.visible = false;
    scene.add(dust);

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function activeTargets() {
      return mode === "yes" ? targetsYes : targetsNo;
    }

    function applyColors() {
      const src = mode === "yes" ? colorsYes : colorsNo;
      const arr = geometry.attributes.color.array;
      for (let i = 0; i < COUNT * 3; i++) arr[i] = src[i];
      geometry.attributes.color.needsUpdate = true;

      if (mode === "yes") {
        baseMat.color.set("#ff6b9d");
        baseInnerMat.color.set("#ff8fb3");
        bloom.strength = 0.55;
        renderer.toneMappingExposure = 0.92;
      } else {
        baseMat.color.set("#8a6070");
        baseInnerMat.color.set("#6a4858");
        bloom.strength = 0.35;
        renderer.toneMappingExposure = 0.8;
      }
    }

    function updateFormation(t) {
      const pos = geometry.attributes.position.array;
      const targets = activeTargets();
      for (let i = 0; i < COUNT; i++) {
        const i3 = i * 3;
        const stagger = (i % 260) / 260;
        const local = Math.min(1, Math.max(0, (t - stagger * 0.4) / 0.6));
        const e = easeInOutCubic(local);
        pos[i3] = starts[i3] + (targets[i3] - starts[i3]) * e;
        pos[i3 + 1] = starts[i3 + 1] + (targets[i3 + 1] - starts[i3 + 1]) * e;
        pos[i3 + 2] = starts[i3 + 2] + (targets[i3 + 2] - starts[i3 + 2]) * e;
      }
      geometry.attributes.position.needsUpdate = true;
    }

    function animateHeart(time) {
      const pos = geometry.attributes.position.array;
      const targets = activeTargets();

      if (mode === "yes") {
        for (let i = 0; i < COUNT; i++) {
          const i3 = i * 3;
          const breath = 1 + Math.sin(time * 1.15 + phases[i]) * 0.01;
          const wobble = Math.sin(time * 1.4 + phases[i] * 1.7) * 0.005;
          pos[i3] = targets[i3] * breath + wobble;
          pos[i3 + 1] = targets[i3 + 1] * breath;
          pos[i3 + 2] = targets[i3 + 2] * breath + wobble * 0.5;
        }
      } else {
        // broken halves slowly drift further apart + tremble
        breakGap = Math.min(0.55, breakGap + 0.0022);
        for (let i = 0; i < COUNT; i++) {
          const i3 = i * 3;
          const side = sides[i];
          const shake = Math.sin(time * 3.2 + phases[i]) * 0.012;
          pos[i3] = targets[i3] + side * breakGap + shake * side;
          pos[i3 + 1] = targets[i3 + 1] - breakGap * 0.25 + Math.abs(shake) * 0.4;
          pos[i3 + 2] = targets[i3 + 2] + shake * 0.3;
        }
      }
      geometry.attributes.position.needsUpdate = true;
    }

    const clock = new THREE.Clock();
    let last = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const delta = Math.min(0.05, (now - last) / 1000);
      last = now;
      const elapsed = clock.getElapsedTime();
      material.uniforms.uTime.value = elapsed;

      if (unlocked) {
        if (forming) {
          formProgress = Math.min(1, (performance.now() - startTime) / (FORM_DURATION * 1000));
          updateFormation(formProgress);
          spinEase = THREE.MathUtils.damp(spinEase, mode === "yes" ? 0.35 : 0.12, 1.2, delta);
          if (formProgress >= 1) forming = false;
        } else {
          animateHeart(elapsed);
          spinEase = THREE.MathUtils.damp(spinEase, mode === "yes" ? 1 : 0.35, 1.8, delta);
        }

        spinAmount += SPIN_SPEED * spinEase * delta;
        heartGroup.rotation.y = spinAmount;
        if (mode === "yes") {
          heartGroup.rotation.x = Math.sin(spinAmount * 0.55) * 0.1;
          heartGroup.rotation.z = Math.sin(spinAmount * 0.35) * 0.035;
        } else {
          heartGroup.rotation.x = Math.sin(spinAmount * 0.4) * 0.06;
          heartGroup.rotation.z = Math.sin(elapsed * 0.8) * 0.04;
        }

        camera.position.x = Math.sin(elapsed * 0.12) * 0.15;
        camera.position.y = 0.2 + Math.sin(elapsed * 0.18) * 0.06;
        camera.lookAt(0, 0.15, 0);

        base.rotation.z = elapsed * 0.18;
        baseInner.rotation.z = -elapsed * 0.12;
        const pulse = (mode === "yes" ? 0.11 : 0.07) + Math.sin(elapsed * 1.2) * 0.025;
        baseMat.opacity = pulse;
        baseInnerMat.opacity = pulse * 0.85;
        dust.rotation.y = elapsed * 0.03;
      }

      composer.render();
    }
    requestAnimationFrame(animate);

    function unlock(choice) {
      if (unlocked) return;
      unlocked = true;
      mode = choice;
      forming = true;
      formProgress = 0;
      startTime = performance.now();
      spinEase = 0;
      spinAmount = 0;
      breakGap = 0;

      applyColors();
      prompt.classList.add("hidden");
      canvas.classList.add("on");
      base.visible = true;
      baseInner.visible = true;
      dust.visible = true;
    }

    btnYes.addEventListener("click", () => unlock("yes"));
    btnNo.addEventListener("click", () => unlock("no"));

    window.addEventListener("resize", () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      material.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
      bloom.setSize(w, h);
    });
  </script>
</body>
</html>
