<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Like You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #5c2a3d;
      --pink: #e85a8c;
      --soft: #fff0f5;
      --glow: rgba(232, 90, 140, 0.35);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      color: var(--ink);
      font-family: "Outfit", sans-serif;
    }

    body {
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(255, 180, 200, 0.55), transparent 55%),
        radial-gradient(ellipse 70% 50% at 80% 90%, rgba(255, 140, 170, 0.28), transparent 50%),
        radial-gradient(ellipse 60% 45% at 10% 70%, rgba(255, 200, 210, 0.4), transparent 45%),
        linear-gradient(165deg, #ffe8ef 0%, #ffd6e4 45%, #ffc4d6 100%);
      transition: background 1.2s ease;
    }

    body.revealed {
      background:
        radial-gradient(ellipse 55% 45% at 50% 55%, rgba(120, 40, 70, 0.45), transparent 65%),
        linear-gradient(180deg, #2a1520 0%, #1a0e14 100%);
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0;
      transition: opacity 1.4s ease;
      z-index: 0;
    }

    #canvas.on { opacity: 1; }

    .vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(255, 170, 190, 0.18) 100%);
      z-index: 1;
      transition: background 1.2s ease;
    }

    body.revealed .vignette {
      background: radial-gradient(ellipse at 50% 42%, transparent 30%, rgba(0, 0, 0, 0.55) 100%);
    }

    .stage {
      position: relative;
      z-index: 2;
      width: min(92vw, 480px);
      text-align: center;
      padding: 2rem 1.25rem;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0 auto;
    }

    .prompt {
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .prompt.hidden {
      opacity: 0;
      transform: translateY(-12px) scale(0.97);
      pointer-events: none;
    }

    .eyebrow {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(92, 42, 61, 0.55);
      margin-bottom: 1rem;
    }

    .question {
      font-family: "Outfit", sans-serif;
      font-weight: 700;
      font-size: clamp(2rem, 7.5vw, 2.85rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: #5c2a3d;
      margin-bottom: 0.75rem;
    }

    .sub {
      font-size: clamp(1.05rem, 3vw, 1.25rem);
      font-weight: 400;
      color: rgba(92, 42, 61, 0.72);
      letter-spacing: 0.01em;
      margin-bottom: 2.5rem;
      line-height: 1.45;
    }

    .choices {
      display: flex;
      gap: 0.85rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: none;
      background: #e85a8c;
      color: #fff;
      font-family: "Outfit", sans-serif;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.04em;
      padding: 0.9rem 2rem;
      min-width: 128px;
      cursor: pointer;
      border-radius: 14px;
      box-shadow: 0 10px 28px -12px rgba(232, 90, 140, 0.65);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn:hover, .btn:focus-visible {
      outline: none;
      transform: translateY(-2px);
      background: #d9487c;
      box-shadow: 0 14px 32px -12px rgba(232, 90, 140, 0.75);
    }

    .btn.no {
      background: #fff;
      color: #5c2a3d;
      border: 1.5px solid rgba(92, 42, 61, 0.18);
      box-shadow: 0 8px 22px -14px rgba(92, 42, 61, 0.35);
    }

    .btn.no:hover, .btn.no:focus-visible {
      background: #fff7fa;
      border-color: rgba(92, 42, 61, 0.3);
      box-shadow: 0 12px 28px -14px rgba(92, 42, 61, 0.4);
    }

    .btn:active { transform: translateY(0) scale(0.98); }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <section class="prompt" id="prompt">
      <p class="eyebrow">Hey…</p>
      <h1 class="question">I like you.</h1>
      <p class="sub">Will you be my boyfriend?</p>
      <div class="choices">
        <button class="btn yes" id="btnYes" type="button">Yes</button>
        <button class="btn no" id="btnNo" type="button">No</button>
      </div>
    </section>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const COUNT = 16000;
    const FORM_DURATION = 2.8;
    const SPIN_SPEED = 0.22;

    const prompt = document.getElementById("prompt");
    const canvas = document.getElementById("canvas");
    const btnYes = document.getElementById("btnYes");
    const btnNo = document.getElementById("btnNo");

    let unlocked = false;
    let mode = "yes"; // "yes" | "no"
    let forming = false;
    let formProgress = 0;
    let startTime = 0;
    let spinAmount = 0;
    let spinEase = 0;
    let breakGap = 0;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1a0e14, 0.028);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.2, 6.4);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: "high-performance",
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x1a0e14, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.78,
      0.58,
      0.16
    );
    composer.addPass(bloom);

    function insideHeart(x, y, z) {
      const a = x * x + 2.25 * y * y + z * z - 1;
      return a * a * a - x * x * z * z * z - 0.1125 * y * y * z * z * z <= 0;
    }

    function sampleHeartPoint() {
      let x, y, z;
      let tries = 0;
      do {
        x = (Math.random() * 2 - 1) * 1.35;
        y = (Math.random() * 2 - 1) * 1.25;
        z = (Math.random() * 2 - 1) * 1.2;
        tries++;
      } while (!insideHeart(x, y, z) && tries < 90);

      if (tries >= 90) {
        const t = Math.random() * Math.PI * 2;
        const u = 0.65 + Math.random() * 0.35;
        x = 16 * Math.pow(Math.sin(t), 3) * 0.048 * u;
        z = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 0.048 * u;
        y = (Math.random() - 0.5) * 0.5;
        return new THREE.Vector3(x * 1.25, z * 1.25 + 0.3, y * 1.25);
      }

      return new THREE.Vector3(x * 1.4, z * 1.4 + 0.3, y * 1.4);
    }

    function randomScatter() {
      const r = 4 + Math.random() * 6;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      return new THREE.Vector3(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.sin(phi) * Math.sin(theta) * 0.65,
        r * Math.cos(phi)
      );
    }

    const targetsYes = new Float32Array(COUNT * 3);
    const targetsNo = new Float32Array(COUNT * 3);
    const starts = new Float32Array(COUNT * 3);
    const positions = new Float32Array(COUNT * 3);
    const colorsYes = new Float32Array(COUNT * 3);
    const colorsNo = new Float32Array(COUNT * 3);
    const colors = new Float32Array(COUNT * 3);
    const sizes = new Float32Array(COUNT);
    const phases = new Float32Array(COUNT);
    const sides = new Float32Array(COUNT); // -1 left, 1 right for broken heart

    // Clear romantic gradient: tip → mid → lobes → highlight
    const cTip = new THREE.Color("#e0125a");
    const cMid = new THREE.Color("#ff3d8a");
    const cLobe = new THREE.Color("#ff7eb3");
    const cGlow = new THREE.Color("#ffc0d8");
    const cAsh = new THREE.Color("#8a6070");
    const cFade = new THREE.Color("#c48a9c");
    const cCrack = new THREE.Color("#5a3a48");
    const tmp = new THREE.Color();

    for (let i = 0; i < COUNT; i++) {
      const p = sampleHeartPoint();
      const s = randomScatter();
      const i3 = i * 3;

      // whole heart target
      targetsYes[i3] = p.x;
      targetsYes[i3 + 1] = p.y;
      targetsYes[i3 + 2] = p.z;

      // broken heart: clear left/right halves with a crack gap
      const side = p.x >= 0 ? 1 : -1;
      sides[i] = side;
      const crack = 0.22; // visible gap down the middle
      const outward = 0.55; // halves pull apart
      const drop = side > 0 ? -0.08 : -0.18;
      const tiltZ = side * 0.12;

      targetsNo[i3] = p.x + side * (outward + crack);
      targetsNo[i3 + 1] = p.y + drop + Math.abs(p.x) * tiltZ * 0.15;
      targetsNo[i3 + 2] = p.z + side * 0.08;

      // carve a jagged crack: push points near center further apart + downward shards
      if (Math.abs(p.x) < 0.18) {
        targetsNo[i3] += side * 0.35;
        targetsNo[i3 + 1] -= 0.25 + Math.random() * 0.45;
        targetsNo[i3 + 2] += (Math.random() - 0.5) * 0.2;
      }

      starts[i3] = s.x;
      starts[i3 + 1] = s.y;
      starts[i3 + 2] = s.z;

      positions[i3] = s.x;
      positions[i3 + 1] = s.y;
      positions[i3 + 2] = s.z;

      const h = THREE.MathUtils.clamp((p.y + 1.1) / 2.6, 0, 1);
      const depth = THREE.MathUtils.clamp((p.z + 1.2) / 2.4, 0, 1);

      // yes — vivid romantic pink gradient (clear bands)
      if (h < 0.28) tmp.copy(cTip).lerp(cMid, h / 0.28);
      else if (h < 0.58) tmp.copy(cMid).lerp(cLobe, (h - 0.28) / 0.3);
      else tmp.copy(cLobe).lerp(cGlow, (h - 0.58) / 0.42);
      // front face brighter for 3D romance glow
      tmp.multiplyScalar(0.95 + depth * 0.22);
      colorsYes[i3] = tmp.r;
      colorsYes[i3 + 1] = tmp.g;
      colorsYes[i3 + 2] = tmp.b;

      // no — faded / ashen pink, darker near crack
      tmp.copy(cAsh).lerp(cFade, h);
      if (Math.abs(p.x) < 0.22) tmp.lerp(cCrack, 0.55);
      tmp.multiplyScalar(0.75 + depth * 0.2);
      colorsNo[i3] = tmp.r;
      colorsNo[i3 + 1] = tmp.g;
      colorsNo[i3 + 2] = tmp.b;

      colors[i3] = colorsYes[i3];
      colors[i3 + 1] = colorsYes[i3 + 1];
      colors[i3 + 2] = colorsYes[i3 + 2];

      sizes[i] = 0.012 + Math.random() * 0.03 + (1 - h) * 0.008;
      phases[i] = Math.random() * Math.PI * 2;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));

    const material = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: true,
      uniforms: {
        uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
        uTime: { value: 0 },
      },
      vertexShader: `
        attribute float aSize;
        uniform float uPixelRatio;
        uniform float uTime;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vColor = color;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          float distFade = clamp(2.6 / max(-mv.z, 0.1), 0.45, 1.25);
          float twinkle = 0.9 + 0.1 * sin(uTime * 1.8 + position.x * 3.5 + position.y * 2.8);
          vAlpha = twinkle;
          gl_PointSize = aSize * uPixelRatio * 255.0 * distFade;
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          float d = length(uv);
          if (d > 0.5) discard;
          float soft = pow(1.0 - smoothstep(0.0, 0.5, d), 1.45);
          float core = smoothstep(0.35, 0.0, d);
          // keep pink vivid — soft glow without washing to white
          vec3 col = vColor * (0.95 + core * 0.25);
          gl_FragColor = vec4(col, soft * vAlpha * 0.52);
        }
      `,
    });

    const heartGroup = new THREE.Group();
    const points = new THREE.Points(geometry, material);
    heartGroup.add(points);
    scene.add(heartGroup);

    const baseGeo = new THREE.RingGeometry(0.4, 1.95, 128);
    const baseMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color("#ff4d8d"),
      transparent: true,
      opacity: 0.22,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const base = new THREE.Mesh(baseGeo, baseMat);
    base.rotation.x = -Math.PI / 2;
    base.position.y = -1.6;
    base.visible = false;
    scene.add(base);

    const baseInnerGeo = new THREE.CircleGeometry(0.55, 64);
    const baseInnerMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color("#ff9ec0"),
      transparent: true,
      opacity: 0.2,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const baseInner = new THREE.Mesh(baseInnerGeo, baseInnerMat);
    baseInner.rotation.x = -Math.PI / 2;
    baseInner.position.y = -1.59;
    baseInner.visible = false;
    scene.add(baseInner);

    const dustCount = 1000;
    const dustPos = new Float32Array(dustCount * 3);
    const dustCol = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount; i++) {
      dustPos[i * 3] = (Math.random() - 0.5) * 16;
      dustPos[i * 3 + 1] = (Math.random() - 0.5) * 11;
      dustPos[i * 3 + 2] = (Math.random() - 0.5) * 16;
      const shade = 0.55 + Math.random() * 0.45;
      dustCol[i * 3] = shade;
      dustCol[i * 3 + 1] = shade * 0.55;
      dustCol[i * 3 + 2] = shade * 0.68;
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos, 3));
    dustGeo.setAttribute("color", new THREE.BufferAttribute(dustCol, 3));
    const dustMat = new THREE.PointsMaterial({
      size: 0.016,
      transparent: true,
      opacity: 0.35,
      vertexColors: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const dust = new THREE.Points(dustGeo, dustMat);
    dust.visible = false;
    scene.add(dust);

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function activeTargets() {
      return mode === "yes" ? targetsYes : targetsNo;
    }

    function applyColors() {
      const src = mode === "yes" ? colorsYes : colorsNo;
      const arr = geometry.attributes.color.array;
      for (let i = 0; i < COUNT * 3; i++) arr[i] = src[i];
      geometry.attributes.color.needsUpdate = true;

      if (mode === "yes") {
        baseMat.color.set("#ff3d8a");
        baseInnerMat.color.set("#ff9ec0");
        bloom.strength = 0.78;
        bloom.radius = 0.58;
        bloom.threshold = 0.16;
        renderer.toneMappingExposure = 1.05;
      } else {
        baseMat.color.set("#8a6070");
        baseInnerMat.color.set("#6a4858");
        bloom.strength = 0.4;
        bloom.radius = 0.4;
        bloom.threshold = 0.3;
        renderer.toneMappingExposure = 0.85;
      }
    }

    function updateFormation(t) {
      const pos = geometry.attributes.position.array;
      const targets = activeTargets();
      for (let i = 0; i < COUNT; i++) {
        const i3 = i * 3;
        const stagger = (i % 260) / 260;
        const local = Math.min(1, Math.max(0, (t - stagger * 0.4) / 0.6));
        const e = easeInOutCubic(local);
        pos[i3] = starts[i3] + (targets[i3] - starts[i3]) * e;
        pos[i3 + 1] = starts[i3 + 1] + (targets[i3 + 1] - starts[i3 + 1]) * e;
        pos[i3 + 2] = starts[i3 + 2] + (targets[i3 + 2] - starts[i3 + 2]) * e;
      }
      geometry.attributes.position.needsUpdate = true;
    }

    function animateHeart(time) {
      const pos = geometry.attributes.position.array;
      const targets = activeTargets();

      if (mode === "yes") {
        for (let i = 0; i < COUNT; i++) {
          const i3 = i * 3;
          const breath = 1 + Math.sin(time * 1.15 + phases[i]) * 0.01;
          const wobble = Math.sin(time * 1.4 + phases[i] * 1.7) * 0.005;
          pos[i3] = targets[i3] * breath + wobble;
          pos[i3 + 1] = targets[i3 + 1] * breath;
          pos[i3 + 2] = targets[i3 + 2] * breath + wobble * 0.5;
        }
      } else {
        // broken halves slowly drift further apart + tremble
        breakGap = Math.min(0.55, breakGap + 0.0022);
        for (let i = 0; i < COUNT; i++) {
          const i3 = i * 3;
          const side = sides[i];
          const shake = Math.sin(time * 3.2 + phases[i]) * 0.012;
          pos[i3] = targets[i3] + side * breakGap + shake * side;
          pos[i3 + 1] = targets[i3 + 1] - breakGap * 0.25 + Math.abs(shake) * 0.4;
          pos[i3 + 2] = targets[i3 + 2] + shake * 0.3;
        }
      }
      geometry.attributes.position.needsUpdate = true;
    }

    const clock = new THREE.Clock();
    let last = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const delta = Math.min(0.05, (now - last) / 1000);
      last = now;
      const elapsed = clock.getElapsedTime();
      material.uniforms.uTime.value = elapsed;

      if (unlocked) {
        if (forming) {
          formProgress = Math.min(1, (performance.now() - startTime) / (FORM_DURATION * 1000));
          updateFormation(formProgress);
          spinEase = THREE.MathUtils.damp(spinEase, mode === "yes" ? 0.35 : 0.12, 1.2, delta);
          if (formProgress >= 1) forming = false;
        } else {
          animateHeart(elapsed);
          spinEase = THREE.MathUtils.damp(spinEase, mode === "yes" ? 1 : 0.35, 1.8, delta);
        }

        spinAmount += SPIN_SPEED * spinEase * delta;
        heartGroup.rotation.y = spinAmount;
        if (mode === "yes") {
          heartGroup.rotation.x = Math.sin(spinAmount * 0.55) * 0.1;
          heartGroup.rotation.z = Math.sin(spinAmount * 0.35) * 0.035;
        } else {
          heartGroup.rotation.x = Math.sin(spinAmount * 0.4) * 0.06;
          heartGroup.rotation.z = Math.sin(elapsed * 0.8) * 0.04;
        }

        camera.position.x = Math.sin(elapsed * 0.12) * 0.15;
        camera.position.y = 0.2 + Math.sin(elapsed * 0.18) * 0.06;
        camera.lookAt(0, 0.15, 0);

        base.rotation.z = elapsed * 0.18;
        baseInner.rotation.z = -elapsed * 0.12;
        const pulse = (mode === "yes" ? 0.11 : 0.07) + Math.sin(elapsed * 1.2) * 0.025;
        baseMat.opacity = pulse;
        baseInnerMat.opacity = pulse * 0.85;
        dust.rotation.y = elapsed * 0.03;
      }

      composer.render();
    }
    requestAnimationFrame(animate);

    function unlock(choice) {
      if (unlocked) return;
      unlocked = true;
      mode = choice;
      forming = true;
      formProgress = 0;
      startTime = performance.now();
      spinEase = 0;
      spinAmount = 0;
      breakGap = 0;

      applyColors();
      document.body.classList.add("revealed");
      prompt.classList.add("hidden");
      canvas.classList.add("on");
      base.visible = true;
      baseInner.visible = true;
      dust.visible = true;
    }

    btnYes.addEventListener("click", () => unlock("yes"));
    btnNo.addEventListener("click", () => unlock("no"));

    window.addEventListener("resize", () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      composer.setSize(w, h);
      material.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
      bloom.setSize(w, h);
    });
  </script>
</body>
</html>
