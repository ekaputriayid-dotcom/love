<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Universe of Love</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Outfit", sans-serif;
      color: #fff;
      touch-action: none;
    }
    #c {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 5;
      padding: 1rem 1rem 0;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    .hud.hidden { opacity: 0; }
    .hud h1 {
      font-size: clamp(1.2rem, 4.5vw, 1.65rem);
      font-weight: 700;
      text-shadow: 0 0 20px rgba(255, 120, 180, 0.65);
    }
    .hud p {
      margin-top: 0.3rem;
      font-size: 0.88rem;
      color: rgba(255, 210, 230, 0.78);
    }
    .hud .progress {
      margin-top: 0.4rem;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: rgba(255, 160, 200, 0.9);
    }
    .hint-drag {
      position: fixed;
      bottom: 1.1rem;
      left: 0; right: 0;
      z-index: 5;
      text-align: center;
      font-size: 0.78rem;
      color: rgba(255, 200, 220, 0.45);
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    .hint-drag.hidden { opacity: 0; }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .modal.open { opacity: 1; visibility: visible; }
    .modal-card {
      width: min(100%, 340px);
      background: linear-gradient(165deg, #fff7fa, #ffe4ee);
      color: #5c2a3d;
      border-radius: 22px;
      padding: 1.5rem 1.3rem 1.25rem;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      transform: translateY(12px) scale(0.96);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .modal.open .modal-card { transform: none; }
    .modal-emoji {
      font-size: 3rem;
      margin-bottom: 0.65rem;
    }
    .modal-card h2 {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(92, 42, 61, 0.5);
      margin-bottom: 0.45rem;
    }
    .modal-card p {
      font-size: clamp(1.15rem, 4.4vw, 1.4rem);
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 1.2rem;
    }
    .modal-card button {
      appearance: none;
      border: none;
      background: #e85a8c;
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.78rem 1.5rem;
      border-radius: 12px;
      cursor: pointer;
    }
    .finale {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: rgba(0, 0, 0, 0.42);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    .finale.show { opacity: 1; visibility: visible; }
    .finale.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    .finale-inner { text-align: center; max-width: 400px; }
    .finale .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 200, 220, 0.65);
      margin-bottom: 0.55rem;
    }
    .finale h1 {
      font-size: clamp(1.9rem, 7vw, 2.55rem);
      font-weight: 700;
      margin-bottom: 0.45rem;
      text-shadow: 0 0 28px rgba(255, 100, 160, 0.55);
    }
    .finale .sub {
      color: rgba(255, 220, 230, 0.82);
      margin-bottom: 1.7rem;
      font-size: 1.08rem;
    }
    .choices {
      display: flex;
      gap: 0.85rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      appearance: none;
      border: none;
      background: #e85a8c;
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.9rem 2rem;
      min-width: 128px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 0 28px rgba(232, 90, 140, 0.45);
    }
    .btn.no {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 220, 230, 0.35);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="hud" id="hud">
    <h1>Universe of Love</h1>
    <p>Tap the icons orbiting the heart-sun</p>
    <p class="progress" id="progress">0 / 6 opened</p>
  </div>
  <p class="hint-drag" id="hintDrag">Drag to spin · Pinch to zoom</p>

  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-emoji" id="msgEmoji">🎀</div>
      <h2 id="msgTitle">A little note</h2>
      <p id="msgText"></p>
      <button type="button" id="msgClose">Got it</button>
    </div>
  </div>

  <section class="finale" id="finale">
    <div class="finale-inner">
      <p class="eyebrow">Hey…</p>
      <h1>I like you.</h1>
      <p class="sub">Will you be my boyfriend?</p>
      <div class="choices">
        <button class="btn" id="btnYes" type="button">Yes</button>
        <button class="btn no" id="btnNo" type="button">No</button>
      </div>
    </div>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const ICONS = [
      { kind: "hellokitty", label: "Hello Kitty", text: "You make my world feel soft and sweet." },
      { kind: "emoji", emoji: "🕷️", label: "Hero", text: "I smile every time I think of you." },
      { kind: "emoji", emoji: "🍓", label: "Strawberry", text: "You're my favorite kind of happiness." },
      { kind: "emoji", emoji: "🌸", label: "Sakura", text: "My heart blooms whenever you're near." },
      { kind: "emoji", emoji: "🧸", label: "Teddy", text: "I feel safe and warm with you." },
      { kind: "emoji", emoji: "💘", label: "Cupid", text: "I like you more than words can say." },
    ];

    // Each icon gets its own planet-like orbit radius
    const ORBITS = [5.2, 6.8, 8.4, 10.0, 11.6, 13.2];

    const canvas = document.getElementById("c");
    const hud = document.getElementById("hud");
    const hintDrag = document.getElementById("hintDrag");
    const progressEl = document.getElementById("progress");
    const modal = document.getElementById("modal");
    const msgEmoji = document.getElementById("msgEmoji");
    const msgTitle = document.getElementById("msgTitle");
    const msgText = document.getElementById("msgText");
    const msgClose = document.getElementById("msgClose");
    const finale = document.getElementById("finale");
    const btnYes = document.getElementById("btnYes");
    const btnNo = document.getElementById("btnNo");

    const opened = new Set();
    let paused = false;
    let finaleMode = false;
    let answer = null;
    let pointerDown = null;
    let dragged = false;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030208, 0.012);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 9, 20);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: "high-performance",
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = true;
    controls.enableZoom = true;
    controls.minDistance = 8;
    controls.maxDistance = 42;
    controls.target.set(0, 0.6, 0);
    controls.autoRotate = false;
    controls.rotateSpeed = 0.7;
    controls.zoomSpeed = 0.9;
    controls.panSpeed = 0.6;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.7,
      0.45,
      0.2
    );
    composer.addPass(bloom);

    // —— Stars ——
    {
      const n = 2200;
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const r = 35 + Math.random() * 90;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
        pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
        pos[i * 3 + 2] = r * Math.cos(ph);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0xffd6ea,
        size: 0.07,
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      })));
    }

    // Soft nebula glow behind sun
    {
      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(3.2, 32, 32),
        new THREE.MeshBasicMaterial({
          color: 0xff4d8d,
          transparent: true,
          opacity: 0.12,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      );
      scene.add(glow);
    }

    // —— Heart-sun (clean mesh, NOT particle cloud) ——
    function createHeartShape() {
      const s = new THREE.Shape();
      // Classic heart outline
      s.moveTo(0, -0.85);
      s.bezierCurveTo(-0.15, -0.55, -1.05, -0.35, -1.05, 0.25);
      s.bezierCurveTo(-1.05, 0.75, -0.55, 1.05, 0, 0.65);
      s.bezierCurveTo(0.55, 1.05, 1.05, 0.75, 1.05, 0.25);
      s.bezierCurveTo(1.05, -0.35, 0.15, -0.55, 0, -0.85);
      return s;
    }

    function makeHeartSun(broken = false) {
      const group = new THREE.Group();

      if (!broken) {
        const geo = new THREE.ExtrudeGeometry(createHeartShape(), {
          depth: 0.55,
          bevelEnabled: true,
          bevelThickness: 0.12,
          bevelSize: 0.1,
          bevelSegments: 4,
          curveSegments: 20,
        });
        geo.center();
        // tip points up
        geo.rotateZ(Math.PI);

        const mat = new THREE.MeshStandardMaterial({
          color: 0xff2f74,
          emissive: 0xff4d8d,
          emissiveIntensity: 1.35,
          roughness: 0.35,
          metalness: 0.15,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.scale.setScalar(1.55);
        group.add(mesh);

        // Inner bright core (sun feel)
        const core = new THREE.Mesh(
          new THREE.SphereGeometry(0.55, 24, 24),
          new THREE.MeshBasicMaterial({
            color: 0xffc0d8,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          })
        );
        group.add(core);

        // Corona ring
        const corona = new THREE.Mesh(
          new THREE.RingGeometry(1.55, 2.15, 64),
          new THREE.MeshBasicMaterial({
            color: 0xff6b9d,
            transparent: true,
            opacity: 0.35,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          })
        );
        corona.rotation.x = Math.PI / 2;
        group.add(corona);
        group.userData.corona = corona;
        group.userData.core = core;
        group.userData.mesh = mesh;
      } else {
        // Two broken halves
        [-1, 1].forEach((side) => {
          const geo = new THREE.ExtrudeGeometry(createHeartShape(), {
            depth: 0.5,
            bevelEnabled: true,
            bevelThickness: 0.1,
            bevelSize: 0.08,
            bevelSegments: 3,
            curveSegments: 16,
          });
          geo.center();
          geo.rotateZ(Math.PI);
          const mat = new THREE.MeshStandardMaterial({
            color: 0x8a4a62,
            emissive: 0x5a3048,
            emissiveIntensity: 0.6,
            roughness: 0.55,
            metalness: 0.1,
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.scale.set(0.85, 1.4, 1.4);
          mesh.position.x = side * 1.15;
          mesh.position.y = side * 0.15;
          mesh.rotation.z = side * 0.25;
          group.add(mesh);
        });
      }

      return group;
    }

    const sunLight = new THREE.PointLight(0xff6b9d, 2.2, 40, 2);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x332033, 0.55));

    let heartSun = makeHeartSun(false);
    scene.add(heartSun);

    // —— Visible orbit rings (always spinning) ——
    const ringGroup = new THREE.Group();
    // slight tilt like a solar system disk
    ringGroup.rotation.x = -0.55;
    scene.add(ringGroup);

    const orbitRings = [];
    ORBITS.forEach((radius, i) => {
      const curve = new THREE.EllipseCurve(0, 0, radius, radius, 0, Math.PI * 2, false, 0);
      const pts = curve.getPoints(128);
      const geo = new THREE.BufferGeometry().setFromPoints(
        pts.map((p) => new THREE.Vector3(p.x, 0, p.y))
      );
      const mat = new THREE.LineBasicMaterial({
        color: new THREE.Color().setHSL(0.92, 0.7, 0.45 + i * 0.03),
        transparent: true,
        opacity: 0.35,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const ring = new THREE.LineLoop(geo, mat);
      ringGroup.add(ring);
      orbitRings.push(ring);

      // soft glowing band under the line
      const band = new THREE.Mesh(
        new THREE.RingGeometry(radius - 0.06, radius + 0.06, 96),
        new THREE.MeshBasicMaterial({
          color: 0xff5a9a,
          transparent: true,
          opacity: 0.08,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      );
      band.rotation.x = -Math.PI / 2;
      ringGroup.add(band);
    });

    // Tiny asteroids on rings for motion feel
    const dust = [];
    for (let i = 0; i < 180; i++) {
      const radius = ORBITS[i % ORBITS.length] + (Math.random() - 0.5) * 0.35;
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.04 + Math.random() * 0.05, 6, 6),
        new THREE.MeshBasicMaterial({
          color: 0xff8fb8,
          transparent: true,
          opacity: 0.7,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      );
      mesh.userData = {
        radius,
        angle: Math.random() * Math.PI * 2,
        speed: 0.35 + Math.random() * 0.5,
      };
      ringGroup.add(mesh);
      dust.push(mesh);
    }

    // —— Icon planets ——
    function drawBadgeBase(g, size) {
      const grd = g.createRadialGradient(size * 0.35, size * 0.3, 10, size * 0.5, size * 0.5, size * 0.48);
      grd.addColorStop(0, "#ffffff");
      grd.addColorStop(0.55, "#ffe4f0");
      grd.addColorStop(1, "#ff8fbc");
      g.fillStyle = grd;
      g.beginPath();
      g.arc(size / 2, size / 2, size * 0.46, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = "rgba(255,255,255,0.95)";
      g.lineWidth = 10;
      g.stroke();
    }

    function makeHelloKittyTexture() {
      const size = 256;
      const c = document.createElement("canvas");
      c.width = size; c.height = size;
      const g = c.getContext("2d");
      drawBadgeBase(g, size);
      const cx = size / 2, cy = size / 2 + 10;
      g.fillStyle = "#fff";
      g.beginPath();
      g.ellipse(cx - 48, cy - 52, 28, 36, -0.25, 0, Math.PI * 2);
      g.ellipse(cx + 48, cy - 52, 28, 36, 0.25, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = "#222"; g.lineWidth = 5; g.stroke();
      g.beginPath();
      g.ellipse(cx, cy, 70, 62, 0, 0, Math.PI * 2);
      g.fillStyle = "#fff"; g.fill(); g.stroke();
      g.fillStyle = "#ff3b6e";
      g.beginPath();
      g.ellipse(cx + 42, cy - 48, 22, 16, 0.4, 0, Math.PI * 2);
      g.ellipse(cx + 68, cy - 40, 22, 16, -0.2, 0, Math.PI * 2);
      g.fill();
      g.beginPath(); g.arc(cx + 55, cy - 44, 8, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#222";
      g.beginPath();
      g.ellipse(cx - 24, cy + 4, 7, 10, 0, 0, Math.PI * 2);
      g.ellipse(cx + 24, cy + 4, 7, 10, 0, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = "#ffb4c8";
      g.beginPath(); g.ellipse(cx, cy + 18, 7, 5, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "#222"; g.lineWidth = 3;
      [[-55, 8], [-55, 20], [-55, 32], [55, 8], [55, 20], [55, 32]].forEach(([x, y], i) => {
        g.beginPath();
        g.moveTo(cx + (i < 3 ? -18 : 18), cy + 12);
        g.lineTo(cx + x * 0.7, cy + y - 4);
        g.stroke();
      });
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeEmojiTexture(emoji) {
      const size = 256;
      const c = document.createElement("canvas");
      c.width = size; c.height = size;
      const g = c.getContext("2d");
      drawBadgeBase(g, size);
      g.font = "140px serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText(emoji, size / 2, size / 2 + 8);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const iconMeshes = [];
    ICONS.forEach((icon, index) => {
      const tex = icon.kind === "hellokitty" ? makeHelloKittyTexture() : makeEmojiTexture(icon.emoji);
      // Use a plane mesh so it sits on the orbit (not always camera-facing flat band)
      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
      });
      const mesh = new THREE.Mesh(new THREE.CircleGeometry(0.85, 48), mat);
      // billboard helper group
      const pivot = new THREE.Object3D();
      pivot.add(mesh);
      mesh.position.y = 0.15;

      const radius = ORBITS[index];
      const angle = (index / ICONS.length) * Math.PI * 2;
      pivot.userData = {
        type: "icon",
        index,
        icon,
        radius,
        angle,
        // Kepler-ish: outer planets slower
        speed: 0.55 / Math.sqrt(radius),
        opened: false,
        mesh,
      };
      pivot.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
      ringGroup.add(pivot);
      iconMeshes.push(pivot);
    });

    // —— Interaction ——
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function setPointer(e) {
      const x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const y = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
      pointer.x = (x / window.innerWidth) * 2 - 1;
      pointer.y = -(y / window.innerHeight) * 2 + 1;
      return { x, y };
    }

    function pickIcon() {
      raycaster.setFromCamera(pointer, camera);
      const targets = iconMeshes.map((p) => p.userData.mesh);
      const hits = raycaster.intersectObjects(targets, false);
      if (!hits.length) return null;
      return hits[0].object.parent; // pivot
    }

    function updateProgress() {
      progressEl.textContent = `${opened.size} / ${ICONS.length} opened`;
    }

    function openIcon(pivot) {
      const { index, icon } = pivot.userData;
      opened.add(index);
      pivot.userData.opened = true;
      pivot.userData.mesh.material.opacity = 0.55;
      updateProgress();
      msgEmoji.textContent = icon.kind === "hellokitty" ? "🎀" : icon.emoji;
      msgTitle.textContent = icon.label;
      msgText.textContent = icon.text;
      modal.classList.add("open");
      paused = true;
      controls.enabled = false;
    }

    function closeModal() {
      modal.classList.remove("open");
      paused = false;
      controls.enabled = true;
      if (opened.size >= ICONS.length && !finaleMode && answer === null) {
        setTimeout(() => {
          hud.classList.add("hidden");
          hintDrag.classList.add("hidden");
          finale.classList.add("show");
          controls.enabled = false;
        }, 280);
      }
    }

    canvas.addEventListener("pointerdown", (e) => {
      const p = setPointer(e);
      pointerDown = p;
      dragged = false;
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!pointerDown) return;
      const p = setPointer(e);
      if (Math.hypot(p.x - pointerDown.x, p.y - pointerDown.y) > 8) dragged = true;
    });

    canvas.addEventListener("pointerup", (e) => {
      if (paused || finale.classList.contains("show") || finaleMode) {
        pointerDown = null;
        return;
      }
      setPointer(e);
      if (!dragged) {
        const hit = pickIcon();
        if (hit) openIcon(hit);
      }
      pointerDown = null;
      dragged = false;
    });

    // Hover cursor
    canvas.addEventListener("pointermove", (e) => {
      if (paused || finaleMode || pointerDown) return;
      setPointer(e);
      canvas.style.cursor = pickIcon() ? "pointer" : "grab";
    });

    msgClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    function replaceSun(broken) {
      scene.remove(heartSun);
      heartSun.traverse((o) => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) {
          if (Array.isArray(o.material)) o.material.forEach((m) => m.dispose());
          else o.material.dispose();
        }
      });
      heartSun = makeHeartSun(broken);
      scene.add(heartSun);
      bloom.strength = broken ? 0.4 : 0.75;
    }

    function choose(choice) {
      answer = choice;
      finaleMode = true;
      finale.classList.add("gone");
      hud.classList.add("hidden");
      hintDrag.classList.add("hidden");
      controls.enabled = true;
      replaceSun(choice === "no");
    }

    btnYes.addEventListener("click", () => choose("yes"));
    btnNo.addEventListener("click", () => choose("no"));

    // —— Animate ——
    const clock = new THREE.Clock();
    let lastT = 0;

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const delta = Math.min(0.05, t - lastT);
      lastT = t;

      controls.update();

      if (!paused) {
        // Heart-sun: gentle spin + pulse (like a living star)
        if (heartSun) {
          heartSun.rotation.y = t * 0.45;
          const pulse = 1 + Math.sin(t * 2.2) * 0.04;
          if (heartSun.userData.mesh) heartSun.userData.mesh.scale.setScalar(1.55 * pulse);
          if (heartSun.userData.corona) {
            heartSun.userData.corona.rotation.z = t * 0.6;
            heartSun.userData.corona.material.opacity = 0.28 + Math.sin(t * 2) * 0.08;
          }
          if (answer === "no") {
            heartSun.rotation.z = Math.sin(t * 1.4) * 0.12;
          }
        }
        sunLight.intensity = 2 + Math.sin(t * 2) * 0.25;

        // Orbit rings keep spinning as a system (slow)
        ringGroup.rotation.y = t * 0.08;

        // Planets (icons) travel along their rings
        for (const pivot of iconMeshes) {
          const d = pivot.userData;
          d.angle += delta * d.speed;
          pivot.position.x = Math.cos(d.angle) * d.radius;
          pivot.position.z = Math.sin(d.angle) * d.radius;
          pivot.position.y = Math.sin(t * 1.5 + d.angle) * 0.12;
          // face camera slightly for readability
          d.mesh.lookAt(camera.position);
        }

        for (const d of dust) {
          const u = d.userData;
          u.angle += delta * (u.speed / Math.sqrt(u.radius));
          d.position.x = Math.cos(u.angle) * u.radius;
          d.position.z = Math.sin(u.angle) * u.radius;
        }
      }

      composer.render();
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloom.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
