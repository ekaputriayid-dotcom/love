<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rose & Butterflies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Outfit", sans-serif;
      color: #ffe4ef;
      touch-action: none;
    }
    #c {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #c:active { cursor: grabbing; }
    .hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 5;
      padding: 1.15rem 1rem 0;
      text-align: center;
      pointer-events: none;
    }
    .hud h1 {
      font-size: clamp(1.15rem, 4.2vw, 1.55rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-shadow: 0 0 22px rgba(255, 140, 190, 0.55);
    }
    .hud p {
      margin-top: 0.35rem;
      font-size: 0.86rem;
      color: rgba(255, 200, 220, 0.55);
    }
    .hint {
      position: fixed;
      bottom: 1.15rem;
      left: 0; right: 0;
      z-index: 5;
      text-align: center;
      font-size: 0.78rem;
      color: rgba(255, 190, 215, 0.4);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <h1>A Rose for You</h1>
    <p>Drag to spin · Scroll / pinch to zoom</p>
  </div>
  <p class="hint">Watch the butterflies dance around the bloom</p>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const canvas = document.getElementById("c");

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050308, 0.025);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2.2, 2.4, 7.2);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      powerPreference: "high-performance",
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x050308, 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.enablePan = true;
    controls.minDistance = 3.2;
    controls.maxDistance = 14;
    controls.target.set(0, 1.1, 0);
    controls.minPolarAngle = 0.15;
    controls.maxPolarAngle = Math.PI - 0.15;
    controls.rotateSpeed = 0.85;

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.55,
      0.4,
      0.35
    );
    composer.addPass(bloom);

    // Soft romantic lighting
    scene.add(new THREE.AmbientLight(0xffd0e0, 0.45));
    const key = new THREE.DirectionalLight(0xffe8f0, 1.35);
    key.position.set(4, 8, 5);
    scene.add(key);
    const fill = new THREE.PointLight(0xff8fb8, 1.2, 25);
    fill.position.set(-3, 3, 2);
    scene.add(fill);
    const rim = new THREE.PointLight(0xffffff, 0.7, 20);
    rim.position.set(0, 2, -4);
    scene.add(rim);

    // Soft background glow
    {
      const n = 700;
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const r = 10 + Math.random() * 35;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
        pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
        pos[i * 3 + 2] = r * Math.cos(ph);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0xffd6ea,
        size: 0.045,
        transparent: true,
        opacity: 0.55,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      })));
    }

    const roseRoot = new THREE.Group();
    scene.add(roseRoot);

    // —— Realistic petal material ——
    function petalMat(hex, roughness = 0.55) {
      return new THREE.MeshStandardMaterial({
        color: hex,
        roughness,
        metalness: 0.05,
        side: THREE.DoubleSide,
      });
    }

    // Shiny dew / highlight sparkles on tips
    function makeSparkle(size = 0.1) {
      const g = new THREE.Group();
      const mat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      g.add(new THREE.Mesh(new THREE.PlaneGeometry(size * 0.15, size * 1.4), mat));
      g.add(new THREE.Mesh(new THREE.PlaneGeometry(size * 1.4, size * 0.15), mat.clone()));
      g.add(new THREE.Mesh(
        new THREE.SphereGeometry(size * 0.14, 8, 8),
        new THREE.MeshBasicMaterial({
          color: 0xffe8f4,
          transparent: true,
          opacity: 1,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        })
      ));
      g.userData.spin = 0.7 + Math.random() * 1.5;
      g.userData.phase = Math.random() * Math.PI * 2;
      return g;
    }

    const sparkles = [];
    function addSparkle(parent, x, y, z, size) {
      const s = makeSparkle(size);
      s.position.set(x, y, z);
      parent.add(s);
      sparkles.push(s);
    }

    // Organic rose petal curve
    function petalShape(w, h, curl = 0.15) {
      const s = new THREE.Shape();
      s.moveTo(0, 0);
      s.bezierCurveTo(w * 0.55, h * 0.08, w * (0.95 - curl), h * 0.45, w * 0.2, h);
      s.bezierCurveTo(0, h * 1.05, 0, h * 1.05, -w * 0.2, h);
      s.bezierCurveTo(-w * (0.95 - curl), h * 0.45, -w * 0.55, h * 0.08, 0, 0);
      return s;
    }

    function makePetal(w, h, color, depth = 0.04) {
      const geo = new THREE.ExtrudeGeometry(petalShape(w, h), {
        depth,
        bevelEnabled: true,
        bevelThickness: depth * 0.6,
        bevelSize: depth * 0.5,
        bevelSegments: 2,
        curveSegments: 22,
      });
      geo.center();
      // Gentle cup bend
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        const x = pos.getX(i);
        pos.setZ(i, pos.getZ(i) - Math.pow(Math.max(0, y + h * 0.4), 1.4) * 0.12 - Math.abs(x) * 0.05);
      }
      pos.needsUpdate = true;
      geo.computeVertexNormals();
      return new THREE.Mesh(geo, petalMat(color));
    }

    const bloomGroup = new THREE.Group();
    bloomGroup.position.y = 2.05;
    roseRoot.add(bloomGroup);

    // Outer open petals (more realistic rose layering)
    const layers = [
      { count: 9, radius: 0.62, scale: [0.95, 1.25], tilt: -0.55, colors: [0xe83a6e, 0xd6285a, 0xf04d7a], y: -0.05 },
      { count: 8, radius: 0.42, scale: [0.78, 1.05], tilt: -0.75, colors: [0xff5a8a, 0xe83a6e, 0xff6b9d], y: 0.08 },
      { count: 7, radius: 0.26, scale: [0.58, 0.82], tilt: -0.95, colors: [0xff7aa8, 0xff5a8a, 0xff8fb8], y: 0.2 },
      { count: 6, radius: 0.12, scale: [0.4, 0.58], tilt: -1.15, colors: [0xffa0c0, 0xff8fb8, 0xffb3cc], y: 0.32 },
      { count: 5, radius: 0.04, scale: [0.26, 0.4], tilt: -1.3, colors: [0xffc8dc, 0xffb3cc], y: 0.42 },
    ];

    layers.forEach((layer, li) => {
      for (let i = 0; i < layer.count; i++) {
        const a = (i / layer.count) * Math.PI * 2 + li * 0.22;
        const [sw, sh] = layer.scale;
        const color = layer.colors[i % layer.colors.length];
        const petal = makePetal(sw, sh, color, 0.035);
        petal.position.set(
          Math.cos(a) * layer.radius,
          layer.y + Math.sin(a * 3) * 0.02,
          Math.sin(a) * layer.radius
        );
        petal.lookAt(0, layer.y + 0.55, 0);
        petal.rotateX(layer.tilt);
        petal.rotateZ((Math.random() - 0.5) * 0.15);
        bloomGroup.add(petal);

        if (li < 3 && i % 2 === 0) {
          addSparkle(petal, 0, sh * 0.35, 0.03, 0.09 + (2 - li) * 0.02);
        }
      }
    });

    // Soft bud center
    const bud = new THREE.Mesh(
      new THREE.SphereGeometry(0.16, 20, 16),
      petalMat(0xffd0e0, 0.45)
    );
    bud.position.y = 0.48;
    bud.scale.set(1, 1.15, 1);
    bloomGroup.add(bud);
    addSparkle(bloomGroup, 0, 0.72, 0.12, 0.16);

    // —— Green stem ——
    const stemMat = new THREE.MeshStandardMaterial({
      color: 0x2f6b3a,
      roughness: 0.75,
      metalness: 0.05,
    });
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.065, 2.5, 14), stemMat);
    stem.position.y = 0.55;
    roseRoot.add(stem);

    // Slight stem curve via segments
    const stemCurve = new THREE.Group();
    roseRoot.add(stemCurve);
    for (let i = 0; i < 5; i++) {
      const seg = new THREE.Mesh(
        new THREE.CylinderGeometry(0.048 - i * 0.002, 0.052 - i * 0.002, 0.5, 12),
        stemMat
      );
      seg.position.y = 0.15 + i * 0.48;
      seg.position.x = Math.sin(i * 0.35) * 0.04;
      seg.rotation.z = Math.sin(i * 0.4) * 0.06;
      stemCurve.add(seg);
    }
    stem.visible = false;

    // Leaves
    function makeLeaf() {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.bezierCurveTo(0.35, 0.2, 0.4, 0.7, 0, 1.1);
      shape.bezierCurveTo(-0.4, 0.7, -0.35, 0.2, 0, 0);
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: 0.02,
        bevelEnabled: false,
        curveSegments: 16,
      });
      geo.center();
      const leaf = new THREE.Mesh(
        geo,
        new THREE.MeshStandardMaterial({
          color: 0x3a8f4a,
          roughness: 0.7,
          side: THREE.DoubleSide,
        })
      );
      return leaf;
    }

    [[-0.9, 0.35], [1.05, -0.4], [-0.55, 0.15]].forEach(([y, rot], i) => {
      const leaf = makeLeaf();
      leaf.scale.set(0.55 + i * 0.08, 0.55 + i * 0.08, 0.55);
      leaf.position.set(i === 1 ? 0.12 : -0.12, 0.7 + i * 0.35, 0);
      leaf.rotation.z = (i === 1 ? 1.1 : -1.1) + rot * 0.2;
      leaf.rotation.y = i === 1 ? 0.4 : -0.3;
      leaf.rotation.x = -0.35;
      roseRoot.add(leaf);
    });

    // Small thorns
    for (let i = 0; i < 6; i++) {
      const thorn = new THREE.Mesh(
        new THREE.ConeGeometry(0.03, 0.12, 5),
        new THREE.MeshStandardMaterial({ color: 0x245530, roughness: 0.8 })
      );
      thorn.position.set(
        Math.cos(i * 1.7) * 0.06,
        0.4 + i * 0.32,
        Math.sin(i * 1.7) * 0.06
      );
      thorn.lookAt(0, thorn.position.y, 0);
      thorn.rotateX(Math.PI / 2);
      roseRoot.add(thorn);
    }

    // Soft ground shadow
    const shadow = new THREE.Mesh(
      new THREE.CircleGeometry(1.4, 32),
      new THREE.MeshBasicMaterial({
        color: 0x000000,
        transparent: true,
        opacity: 0.35,
        depthWrite: false,
      })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = -0.05;
    roseRoot.add(shadow);

    // —— Flying butterflies (3D with flapping wings) ——
    function makeButterfly(colorA, colorB, scale = 1) {
      const group = new THREE.Group();

      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.018, 0.018, 0.16, 8),
        new THREE.MeshStandardMaterial({ color: 0x2a1a22, roughness: 0.6 })
      );
      body.rotation.z = Math.PI / 2;
      group.add(body);
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.025, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0x1a1018, roughness: 0.6 })
      );
      head.position.x = 0.09;
      group.add(head);

      const wingShape = new THREE.Shape();
      wingShape.moveTo(0, 0);
      wingShape.bezierCurveTo(0.15, 0.25, 0.45, 0.35, 0.5, 0.05);
      wingShape.bezierCurveTo(0.48, -0.15, 0.25, -0.2, 0, 0);
      wingShape.moveTo(0, 0);
      wingShape.bezierCurveTo(0.1, -0.15, 0.35, -0.35, 0.4, -0.1);
      wingShape.bezierCurveTo(0.3, 0.05, 0.1, 0.05, 0, 0);

      const wingGeo = new THREE.ShapeGeometry(wingShape, 16);
      const wingMatL = new THREE.MeshStandardMaterial({
        color: colorA,
        roughness: 0.4,
        metalness: 0.1,
        side: THREE.DoubleSide,
        emissive: colorA,
        emissiveIntensity: 0.15,
      });
      const wingMatR = wingMatL.clone();
      wingMatR.color = new THREE.Color(colorB);
      wingMatR.emissive = new THREE.Color(colorB);

      const left = new THREE.Group();
      const right = new THREE.Group();
      const lw = new THREE.Mesh(wingGeo, wingMatL);
      const rw = new THREE.Mesh(wingGeo, wingMatR);
      rw.scale.x = -1;
      left.add(lw);
      right.add(rw);
      left.position.x = -0.02;
      right.position.x = 0.02;
      group.add(left, right);

      group.scale.setScalar(scale);
      group.userData.left = left;
      group.userData.right = right;
      group.userData.flapSpeed = 10 + Math.random() * 6;
      group.userData.flapPhase = Math.random() * Math.PI * 2;
      group.userData.angle = Math.random() * Math.PI * 2;
      group.userData.radius = 1.6 + Math.random() * 2.2;
      group.userData.height = 0.8 + Math.random() * 2.2;
      group.userData.speed = 0.35 + Math.random() * 0.45;
      group.userData.bob = Math.random() * Math.PI * 2;
      group.userData.wander = 0.3 + Math.random() * 0.5;
      return group;
    }

    const butterflies = [
      makeButterfly(0xff6b9d, 0xffb3c9, 1.1),
      makeButterfly(0xff8fb8, 0xffd0e4, 0.9),
      makeButterfly(0xe83a6e, 0xff7aa8, 1.0),
      makeButterfly(0xc44dff, 0xff9ed8, 0.85),
      makeButterfly(0xff4d88, 0xffc0d8, 0.95),
      makeButterfly(0xffa0c0, 0xffffff, 0.75),
    ];
    butterflies.forEach((b) => scene.add(b));

    // Tiny flying sparkles around rose
    for (let i = 0; i < 12; i++) {
      addSparkle(scene, (Math.random() - 0.5) * 4, 0.5 + Math.random() * 3, (Math.random() - 0.5) * 4, 0.07);
      const s = sparkles[sparkles.length - 1];
      s.userData.orbit = true;
      s.userData.angle = Math.random() * Math.PI * 2;
      s.userData.radius = 1.2 + Math.random() * 2;
      s.userData.height = 0.5 + Math.random() * 2.5;
      s.userData.speed = 0.2 + Math.random() * 0.4;
    }

    let autoSpin = true;
    let userInteracting = false;
    controls.addEventListener("start", () => {
      userInteracting = true;
      autoSpin = false;
    });
    controls.addEventListener("end", () => {
      userInteracting = false;
      setTimeout(() => {
        if (!userInteracting) autoSpin = true;
      }, 2000);
    });

    const clock = new THREE.Clock();
    const _look = new THREE.Vector3();
    const _fwd = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const delta = Math.min(0.05, clock.getDelta());

      controls.update();

      if (autoSpin) {
        roseRoot.rotation.y += delta * 0.22;
      }

      // Soft bloom sway
      bloomGroup.rotation.y = Math.sin(t * 0.45) * 0.06;
      bloomGroup.scale.setScalar(1 + Math.sin(t * 1.4) * 0.015);

      // Butterflies fly in lively orbits around the rose
      for (const b of butterflies) {
        const d = b.userData;
        d.angle += delta * d.speed;

        const wobble = Math.sin(t * d.wander + d.bob) * 0.45;
        const r = d.radius + Math.sin(t * 0.8 + d.bob) * 0.35;
        const x = Math.cos(d.angle) * r + Math.cos(d.angle * 2) * wobble * 0.3;
        const z = Math.sin(d.angle) * r + Math.sin(d.angle * 1.5) * wobble * 0.3;
        const y = d.height + Math.sin(t * 2.2 + d.bob) * 0.45 + Math.cos(d.angle * 2) * 0.2;

        // Face flight direction
        _fwd.set(x - b.position.x, y - b.position.y, z - b.position.z);
        b.position.set(x, y, z);
        if (_fwd.lengthSq() > 0.00001) {
          _look.copy(b.position).add(_fwd);
          b.lookAt(_look);
          b.rotateY(Math.PI / 2);
        }

        // Flap wings
        const flap = Math.sin(t * d.flapSpeed + d.flapPhase) * 0.7;
        d.left.rotation.y = -0.35 + flap;
        d.right.rotation.y = 0.35 - flap;
      }

      // Sparkles
      for (const s of sparkles) {
        s.quaternion.copy(camera.quaternion);
        const tw = 0.5 + 0.5 * Math.sin(t * s.userData.spin * 3 + s.userData.phase);
        s.scale.setScalar(tw);
        if (s.userData.orbit) {
          s.userData.angle += delta * s.userData.speed;
          s.position.x = Math.cos(s.userData.angle) * s.userData.radius;
          s.position.z = Math.sin(s.userData.angle) * s.userData.radius;
          s.position.y = s.userData.height + Math.sin(t * 2 + s.userData.phase) * 0.25;
        }
      }

      fill.intensity = 1.05 + Math.sin(t * 1.5) * 0.2;

      composer.render();
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      bloom.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
